          configuration,
          cluster_capacity,
          pod_evicted,
          out_of_memory,
          image_pull,
          runtime_deadline,
          budget_exhausted,
          run_timed_out,
          output_violation,
          run_lost,
          agent_failed,
          revision_ceiling,
          package_stuck,
          deferred_check,
          reconciler_error,
          stopped_by_user,
          other,
        ]
      description: >-
        `deferred_check`: child_ready halted because a check a work package's verification was delegated to did not
        report within the implementation phase's `ciWaitMinutes` (default 60) of the delivery, or rejected because
