# Vendored copy of the Ahoy API contract. Do not edit it here: change ahoy-hosted, then run `npm run api:sync`.
# Source: github.com/Danielimaalmeida/ahoy-hosted (openapi/ahoy-v1.yaml)
# Commit: 521a05bba5a64ecbf20908925e3812d9e017fcf8
openapi: 3.1.0
info:
  title: Ahoy control plane API
  version: 1.0.0-poc
  summary: UI-independent HTTP/JSON contract for hosted Ahoy story deliveries.
  description: |
    The public boundary for any Ahoy client (Angular UI, CLI, scripts). Clients never
    call the SDK worker, read run directories or see Copilot tokens.

    Conventions:
    - Every mutation records the authenticated actor and is rejected when stale
      (`expectedVersion` does not match the story's `version`) or a duplicate
      (for example a second decision at the same gate). Nothing is silently advanced.
    - Commands that the reconciler completes asynchronously return `202` with the
      updated story; watch `/events/stream` or poll the read endpoints for the outcome.
    - Costs are integers in nano-AIU (1 AIU = 1_000_000_000 nano-AIU).
    - Errors use RFC 9457 problem details (`application/problem+json`) with a stable `code`.
      Requests are validated against this document: unknown or repeated query parameters and
      invalid path, query, header or body values answer `400 validation_failed` with `errors`, as does body
      text Postgres cannot store (a NUL character or an unpaired surrogate);
      a method the path does not support answers `400 bad_request` with an `Allow` header. Any
      operation may answer `500 internal_error`.
    - Incompatible changes require a new major version (`/api/v2`).
    - A story's state lives in Postgres (`getStoryState`); artifacts are the files its agents wrote. A story created
      before the relational state model (migration 0002) can still be read, but every change, its state and any
      artifact whose bytes are not in Postgres answer `409 legacy_story`.

    Every request except `/health` must carry a WebEAM (ForgeRock AM, Alpha realm) access token in
    `Authorization: Bearer <jwt>`. The API introspects the token at WebEAM (RFC 7662) with its client ID and
    secret; the token's `sub` is the acting user. A missing or invalid
    token answers `401 unauthenticated`. Only the users named in the server's `AHOY_ALLOWED_QNUMBERS` may use the
    API: an authenticated user whose qnumber is not on that list answers `403 forbidden`. The `X-Ahoy-Actor` header
    is accepted only when the server runs with `AHOY_AUTH=dev` (local POC), where the list is optional.
servers:
  - url: /api/v1
security:
  - webeam: []
  - devActor: []
tags:
  - name: stories
  - name: runs
  - name: questions
  - name: decisions
  - name: artifacts
  - name: events
  - name: jira
  - name: refinements
  - name: metrics
  - name: meetings
paths:
  /health:
    get:
      operationId: getHealth
      tags: [events]
      summary: Liveness and database reachability.
      security: []
      responses:
        '200':
          description: The API and database are reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          $ref: '#/components/responses/Problem'
  /models:
    get:
      operationId: listModels
      tags: [stories]
      summary: The models a person may choose for a story's phases, and what each phase runs on by default.
      description: |
        The catalogue is configured on the server, not read from a Copilot account: `AHOY_MODEL_CATALOG` (a JSON
        file, `source: file`) or the built-in list (`source: built_in`). Every model the server's phase
        configuration names is listed too, so a default is always one a person can pick. `reasoningEfforts` of a
        model is null when the catalogue does not say which efforts it takes; `[]` means it takes none.

        Choosing a model outside this list is still accepted by `startStory` and `setStoryModels`: whether the owner's
        Copilot account may use a model, and whether it takes the effort, is checked by the worker before it sends a
        prompt (0 AIU); a run refused there fails and the story halts.

        `defaults` is what each slot of a story started now (without `controlRef`) runs on when nobody chooses: the
        server's phase configuration, then `phases.tsv` at the control repo's HEAD (`controlSha`). When the control
        repo cannot be read, `controlSha` is null and the defaults come from the configuration alone.
      responses:
        '200':
          description: The model catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalog' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /jira/backlog:
    get:
      operationId: listJiraBacklog
      tags: [jira]
      summary: All Jira Stories, Tasks and Bugs matching the configured backlog query.
      description: |
        Read-only Jira Server REST search, authenticated with the server's `JIRA_PAT`, not the client's
        WebEAM token. Requires `JIRA_BASE_URL` (HTTPS) and `JIRA_PAT` on the API process; neither is returned.
        `JIRA_BACKLOG_JQL` overrides the server-side query. When unset, the default JQL is:
        `project = LUTA AND issuetype in (Story, Task, Bug) AND status in (New, "In Specification", Open, "In Test")
        AND "Feature Team" = OTHER_COMPANY AND Team in (34115) ORDER BY Rank ASC`.

        The default is the workspace's start-page availability filter with Stories, Tasks and Bugs, not the Jira Agile
        board backlog (which excludes sprint-assigned issues). The query must select only Story, Task and Bug
        issues; other issue types cause `503 unavailable`. Epics are not supported. No query parameters
        are accepted. The backend follows all Jira search pages and preserves rank order; `total` equals
        the number of returned items. Issues already started in Ahoy are not excluded.

        A successful result is cached on the server for 30 seconds. No stale or partial result is served.
        Missing configuration, Jira HTTP errors (including PAT rejection or rate limiting), network/timeout
        errors, malformed responses or pagination inconsistencies return `503 unavailable`.
        This lookup never starts a delivery or spends AIU.

        Each item carries `readiness`, fixed rules over its description, labels and "is blocked by" links (the
        description itself is not returned): `missing` when intake would stop it (no description, no acceptance
        criteria section or no items in it, under 200 characters, blocked by an unresolved issue), `attention` when
        the harness may not suit it (a spike or investigation, CI or pipeline changes), else `ready`. Whether a story is
        worth running through the harness is told from its plan (`getStoryPlanFit`).
      responses:
        '200':
          description: Complete backlog in Jira rank order.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraBacklog' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: Where the harness spends AIU, where stories halt, which errors repeat and how long people keep them waiting.
      description: |
        Read-only and 0 AIU (design §5, "Metrics"): aggregated from `runs`, `gate_records`, `review_findings` and
        `events`. Halts are explained by the same rules as `GET /stories/{key}/diagnosis`. The period is
        `[from, to)`; it defaults to the 30 days before now and may span at most 366 days. `owner` keeps the stories
        of one owner, `repo` the stories that touch one child repository, and `model` the runs of one model. Error
        signatures and gate messages are untrusted text. AIU in integer nano-AIU, durations in whole seconds.
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - $ref: '#/components/parameters/MetricsOwner'
        - $ref: '#/components/parameters/MetricsRepo'
        - $ref: '#/components/parameters/MetricsModel'
      responses:
        '200':
          description: The metrics of the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /metrics/export:
    get:
      operationId: exportMetrics
      tags: [metrics]
      summary: The rows behind the metrics as CSV or JSON, one table at a time.
      description: |
        `runs`: every run in the period with its kind (why it ran: `first`, `review_rework`, `ci_fix`, `retry`,
        `repair`, ...), its work package, spend, tokens, outcome and gate verdict. `halts`: every halt, and every block
        at a ceiling, with its diagnosis, when it ended and what ended it (`endedBy`). `gates`: every automated gate
        verdict. `errors`: the grouped errors; a poll of a pull request whose CI is still running is not one. `waits`:
        every wait on a person (answers, a human gate's decision, a halt to end) with its start, end, outcome and
        seconds. Same period and filters as `GET /metrics`. No story text or agent output is exported; messages are
        untrusted text.
      parameters:
        - name: table
          in: query
          required: true
          schema: { type: string, enum: [runs, halts, gates, errors, waits] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - $ref: '#/components/parameters/MetricsOwner'
        - $ref: '#/components/parameters/MetricsRepo'
        - $ref: '#/components/parameters/MetricsModel'
      responses:
        '200':
          description: The table, as a file to save.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /stories:
    get:
      operationId: listStories
      tags: [stories]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StoryStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stories, most recently updated first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: startStory
      tags: [stories]
      summary: Start a story at intake. The actor becomes its owner and runs bill the owner's token.
      description: |
        `models` may choose the model and reasoning effort of each phase from the start (`intake`, `planning`,
        `implementation` and `review`, the one reviewer of `pr_review`); what is left out runs on the server's phase
        configuration, then the pinned `phases.tsv`, then the agent's own profile. `GET /stories/{key}/models` shows
        what each phase will get. Intake runs no model: the reconciler reads the issue from Jira over REST, so a choice
        for `intake` is kept but unused. A `models` that names an unknown slot, an empty choice, a model or effort no
        run can take, or `null` answers `400 validation_failed`, and no story is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStoryRequest' }
      responses:
        '201':
          description: The story was created in phase `intake`; the reconciler will read its issue from Jira (0 AIU).
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getStory
      tags: [stories]
      responses:
        '200':
          description: The story.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/stop:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: stopStory
      tags: [stories]
      summary: Halt the story and cancel its active run, if any. The phase does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopStoryRequest' }
      responses:
        '202':
          description: The story is halted; cancellation of an active run completes asynchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/resume:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: resumeStory
      tags: [stories]
      summary: Clear a halt so the reconciler retries the current phase. May spend AIU.
      description: |
        On an implementation halted package_stuck or package_needs_decision, every failed, stalled,
        blocked or unverified work package is retried, as the package decision `retry` does, with the
        reason as its rework note; the reason is then required (400 without it). The event
        story.resumed names them in retriedPackages. Any other halt is resumed as it stands. A package
        `awaiting_ci` is never retried by a resume: after child_ready halted on its deferred check, a resume
        runs child_ready again, which halts again while the check is still missing past the wait; retry or
        accept that package with its own decision instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeStoryRequest' }
      responses:
        '202':
          description: The story is ready to be stepped again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/refresh-intake:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: refreshIntake
      tags: [stories]
      summary: Refresh Jira intake and invalidate the old plan. The planning that follows may spend AIU.
      description: |
        Human-triggered, during planning or plan_review only, with no active run and before
        implementation has started. Update Jira first. Preserves the story identity, owner,
        pinned control commit, model choices, total budget, cumulative spend and audit evidence.
        Archives current artifacts and state, supersedes all existing questions (still listed
        with supersededAt), and clears the current plan, criteria, work packages and approvals.
        Schedules a new intake, which reads Jira again and spends nothing, followed by planning within the remaining
        story budget.
        confirmSpend must be true; this does not increase the cap or guarantee a successful refresh.
        A failed intake does not restore the obsolete snapshot or plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshIntakeRequest' }
      responses:
        '202':
          description: Intake refresh scheduled, not yet completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/budget:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: setStoryBudget
      tags: [stories]
      summary: Change the story's total AIU cap. May allow further spend.
      description: |
        Takes effect when the reconciler next queues a run; an active run keeps the cap it started with.
        The new cap must not be below what the story has already spent. Status and phase do not change,
        so a halted story still needs `resume`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetStoryBudgetRequest' }
      responses:
        '202':
          description: The story with its new budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/models:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getStoryModels
      tags: [stories]
      summary: The model and reasoning effort each phase of the story runs on, and where each comes from.
      description: |
        One entry per slot of the story's model plan: `intake` (which runs no model: it reads Jira over REST),
        `planning`, `implementation`, and `review` (the one reviewer of `pr_review`). `chosen` is what a person chose
        for the story;
        `model` and `reasoningEffort` are what the slot's next run gets once the server's phase configuration and the
        pinned `phases.tsv` fill in what was not chosen. A choice applies as a pair: an effort configured for another
        model is not carried onto a model a person chose, which then runs at its own default effort. Whether the
        owner's Copilot account may use the model, and whether the model takes the effort, is checked by the worker
        before it sends a prompt (0 AIU); a run refused there fails and the story halts.
      responses:
        '200':
          description: The story's model plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    post:
      operationId: setStoryModels
      tags: [stories]
      summary: Choose the model and reasoning effort for some phases of the story.
      description: |
        Each slot given a choice holds exactly that choice; `null` gives the slot back to the configured defaults;
        slots left out are unchanged. Takes effect when the reconciler next queues a run of that phase: an active run
        keeps the model it started with. Status and phase do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetStoryModelsRequest' }
      responses:
        '202':
          description: The story's model plan after the change, at the story's new version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/runs:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listStoryRuns
      tags: [runs]
      responses:
        '200':
          description: The story's runs, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/RunId' }
    get:
      operationId: getRun
      tags: [runs]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/questions:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listQuestions
      tags: [questions]
      responses:
        '200':
          description: Every question asked for the story, in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/questions/{questionId}/answer:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
      - name: questionId
        in: path
        required: true
        schema: { type: string, pattern: '^Q[1-9][0-9]*$' }
    post:
      operationId: answerQuestion
      tags: [questions]
      summary: Record one human answer. Answers are never replaced; the next run consumes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerRequest' }
      responses:
        '202':
          description: |
            The answer is recorded. When it was the last pending question the story becomes
            `ready` and the reconciler starts a new run of the same phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/gates:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listGateRecords
      tags: [decisions]
      summary: Automated gate verdicts and human decisions, oldest first.
      responses:
        '200':
          description: Gate records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GateRecord' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/decisions:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: decideHumanGate
      tags: [decisions]
      summary: Approve, send back or reject at a human gate. Silence is never approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '202':
          description: The decision is recorded and the story is routed per the phase table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/review:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: resolveReview
      tags: [decisions]
      summary: Settle a review the review gate halted on, by sending the work to rework or overriding the review.
      description: |
        Only for a story halted on the review gate (`gate_halt` or `gate_rejected`) in a review phase. `rework`
        charges the rework ceiling and reopens the work the findings name, or exactly `packages`. `override` moves the
        story to the delivery gate, which still needs a person's decision. Reworking may spend AIU.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReviewRequest' }
      responses:
        '202':
          description: The decision is applied; the story is ready (or terminal at `blocked`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/work-packages/{workPackageId}/decision:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
      - $ref: '#/components/parameters/WorkPackageId'
    post:
      operationId: decideWorkPackage
      tags: [decisions]
      summary: >-
        Retry or accept a work package nothing else will move (failed, stalled, blocked or unverified), or one
        awaiting CI.
      description: |
        Only while the story is halted in implementation. `retry` sends the package round again with `reason` as its
        rework note (may spend AIU); `accept` marks it done as it stands. The repository is still checked by
        `child_ready` before review. A package `awaiting_ci` (its verification delegated to a declared CI check) can
        be decided when child_ready halted or rejected on that check: `accept` drops its deferred checks, so
        child_ready no longer waits for them; `retry` delivers it again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkPackageDecisionRequest' }
      responses:
        '202':
          description: The decision is applied and the story is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/reopen:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: reopenWork
      tags: [decisions]
      summary: Send delivered work packages round again by hand, from a halted implementation or review.
      description: |
        Reopens `packages` (even in a merged repository), or the delivered packages of `repos`, or all delivered
        packages (`done`, or `awaiting_ci` with their deferred checks dropped), with `note` as their rework note, and
        moves the story to implementation. No rework round is charged.
        May spend AIU. A delivery gate is sent back with a decision instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenWorkRequest' }
      responses:
        '202':
          description: The packages are reopened and the story is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/refresh-design:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: refreshDesign
      tags: [decisions]
      summary: Replace a story's Figma design with new frames and send its UI packages round again. May spend AIU.
      description: |
        Human-triggered, for a story whose design was read from Figma, while it is halted in implementation or review
        or waits at the delivery gate (left undecided, it opens again when the work comes back), with no active run;
        also while it is halted in the design phase after an earlier refresh (links that could not be read, or a pack
        the gate refused), which only another refresh can correct. `figmaLinks` are the new frames (each a figma.com
        link with its node-id); they replace the Jira snapshot's links for this story and every later refresh starts
        from them. A Figma link in `reason` is not read. Nothing compares the old design with the new one.
        The current design spec moves to `history/design-v<version>/` as a record (no run is seeded with it), every
        work package of a UI implementer is reopened, however its last run ended, with a note to make the delivered UI
        match the new frames (no rework round or revision is charged), and the story goes to the design phase, which
        reads the new frames and runs the density agent before the packages run again. The plan and the acceptance
        criteria still win where the new design differs. confirmSpend must be true; the request itself spends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshDesignRequest' }
      responses:
        '202':
          description: The design refresh is scheduled; the story is ready in the design phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/anchors:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: amendAnchors
      tags: [decisions]
      summary: Replace or waive verification anchors that child_ready rejected, on a halted implementation.
      description: |
        Only while the story is halted `gate_rejected` in implementation, and only for anchors that the last
        child_ready rejection names; all amendments apply or none. `replace` swaps an anchor for `replacement` (the new
        one is checked on the pull request's added lines like a planned one). `waive` drops it, only when child_ready
        proved it unsatisfiable by design (it is on an unchanged or removed line of the pull request, never an added
        one) and the repository keeps another anchor. Each change is kept in the decision log, and the event
        criteria.anchors_amended records them; the story becomes ready and child_ready runs again. Spends nothing by
        itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendAnchorsRequest' }
      responses:
        '202':
          description: The anchor is amended and the story is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/unblock:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: unblockStory
      tags: [stories]
      summary: Take a story out of `blocked`, back to the phase it was blocked from, with more rework rounds.
      description: |
        Starts the CI fixes of each repository at the CI fix ceiling again; when none is, raises the rework ceiling of
        each repository at it by `rounds`. Named `repos` get both. Then returns the story to the phase that moved it to
        `blocked`, which evaluates its gate again. A story blocked by a person's
        rejection at a human gate cannot be unblocked. May spend AIU.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnblockStoryRequest' }
      responses:
        '202':
          description: The story is ready again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /stories/{key}/state:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getStoryState
      tags: [stories]
      summary: The story's state, as a worker's `state.json` shows it to the agents.
      description: >-
        Rendered from the story's typed tables in Postgres, where the state lives: acceptance criteria, work
        packages, child repositories, reviews, human gates, revisions, the gate rejection, `gate_results` (from the
        gate records) and `decision_log` (from the `decisions` table). The field names follow the control
        repo's `state.json`; fields the agents wrote that no rule reads are passed through as they wrote them. A
        reviewer's report shows the fields the review gate reads; the report as written is in its
        `review.reported` event.
      responses:
        '200':
          description: The state document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/artifacts:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: The story's current artifact set (Jira snapshot, plan and the other files its agents wrote).
      responses:
        '200':
          description: Current artifacts.
          content:
            application/json:
              schema:
                type: object
                required: [revision, items]
                additionalProperties: false
                properties:
                  revision:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/artifacts/content:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
      - name: path
        in: query
        required: true
        description: Story-relative path, as listed by `listArtifacts`.
        schema: { $ref: '#/components/schemas/ArtifactPath' }
      - name: revision
        in: query
        required: false
        description: Artifact-set revision; defaults to the current one.
        schema: { type: integer, minimum: 1 }
      - name: If-None-Match
        in: header
        required: false
        description: An ETag from an earlier response; a match answers 304 without a body.
        schema: { type: string, maxLength: 200 }
    get:
      operationId: getArtifactContent
      tags: [artifacts]
      responses:
        '304':
          description: The content has not changed since the given ETag.
        '200':
          description: The artifact bytes.
          headers:
            ETag:
              description: The quoted sha256 of the content.
              schema: { type: string }
          content:
            text/markdown:
              schema: { type: string }
            application/json:
              schema: {}
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/plan-fit:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getStoryPlanFit
      tags: [stories]
      summary: Whether the story's plan suits the harness, for the person deciding `plan_accepted`.
      description: |
        Fixed rules over the planned work packages and acceptance criteria; it spends nothing and changes nothing.
        `poor` when a criterion needs CI or pipeline changes, which the implementation workflow may not make.
        `attention` when work waits across repositories, the plan changes more than 2 repositories, has more than 6
        work packages or a `depends_on` chain longer than 3, or a criterion names a repository no package changes.
        Else `fits`. `fit` is null until the planner has written work packages.
      responses:
        '200':
          description: The plan fit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryPlanFit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/diagnosis:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getStoryDiagnosis
      tags: [stories]
      summary: Why the story stands where it stands, and what fixes it.
      description: |
        Read from the story, its runs and its latest `story.halted` event by fixed rules; it spends nothing and
        changes nothing. A story that is not `halted` has no findings. Each finding names a known cause (Copilot
        authentication, a gate rejection, missing configuration, the cluster not scheduling or removing the run's pod,
        the budget, a timeout, forbidden writes, a lost run…), the evidence for it, the action that fixes it and who
        takes it; a halt no rule explains gets one `other` finding with what is known. Evidence quotes runs, gates and
        Kubernetes and is untrusted text.
      responses:
        '200':
          description: The diagnosis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnosis' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /stories/{key}/agent-diagnoses:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listAgentDiagnoses
      tags: [stories]
      summary: Every agent diagnosis of one story, newest first, with the agent's Markdown.
      description: |
        A story no agent was asked to diagnose answers `200` with no items. `404` when the story does not exist. An agent
        diagnosis has the shape of a refinement (`Refinement`); it is not the rules' diagnosis of `getStoryDiagnosis`.
      responses:
        '200':
          description: The story's agent diagnoses, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDiagnosisList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestAgentDiagnosis
      tags: [stories]
      summary: Ask an agent to diagnose a halted story. May spend AIU.
      description: |
        For what the fixed rules of `getStoryDiagnosis` cannot explain. Queues one worker run of the server's diagnosis
        agent (`AHOY_DIAGNOSIS_AGENT`) for the story, pinned to the control repo's HEAD now. The agent reads the evidence
        Ahoy seeds (the rules' findings, the halt, the runs, gate verdicts and runtime facts, all untrusted text) and the
        control repo's agents and configuration, and replies in Markdown with the cause, the evidence, what fixes it and
        who takes it. The reply is kept in Ahoy only. The agent has no MCP server, no shell and writes no files, and it
        changes nothing about the story: the halt reason, the status and the version stay as they are.

        The story must be `halted` (`409 invalid_state` otherwise). `confirmSpend` must be true. The run is capped at
        `budgetNanoAiu` (at most 100 AIU), else the server's diagnosis cap (10 AIU by default); it is not charged to the
        story. It shares the run slots with the stories' runs, so it may wait (`queued`). Poll `listAgentDiagnoses` for
        the outcome; it sends no events. One agent diagnosis per story is in progress at a time: another request
        answers `409 invalid_state`. `503 unavailable` when it is not configured or the control repo cannot be read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentDiagnosisRequest' }
      responses:
        '202':
          description: The agent diagnosis, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refinement' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /stories/{key}/agent-diagnoses/cancel:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: cancelAgentDiagnosis
      tags: [stories]
      summary: Stop the story's agent diagnosis in progress.
      description: |
        A queued one ends `cancelled` at once and spends nothing. A running one is marked `cancelRequested`; the
        reconciler stops its worker and records what it spent. Who cancelled and why become its `exitReason`.
        `409 invalid_state` when nothing is in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRefinementRequest' }
      responses:
        '202':
          description: The agent diagnosis, cancelled or being cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refinement' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/knowledge-reviews:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listKnowledgeReviews
      tags: [stories]
      summary: Every knowledge review of one story, newest first, with the proposed business rules and lessons.
      description: |
        When a person accepts a story's delivery and it reaches `done`, the server queues a knowledge review if it runs
        them (`AHOY_KNOWLEDGE_AGENT`): an agent reads what the story decided (the Jira snapshot, the acceptance criteria,
        the approved plan, the answers people gave and their decisions at the human gates) and what got in its way (its
        halts, the gates' rejections, rework notes and reviewer findings), and proposes changes to the content
        repository's `knowledge/business-context.md` and one to three lessons for `knowledge/lessons.md`. Its summary is
        `content`; the whole proposed files are `proposal` and `lessons`, and one unified diff of both against the files
        at `controlSha` is `patch` (for `git apply`). Each file is null when the agent left it as it was, and `patch`
        when it changed neither. Ahoy changes nothing in the content repository: a person opens the pull request
        there with the patch, and the rules are approved in that pull request. A story without one answers `200` with no
        items. `404` when the story does not exist.
      responses:
        '200':
          description: The story's knowledge reviews, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeReviewList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestKnowledgeReview
      tags: [stories]
      summary: Ask an agent for a delivered story's rules and lessons, or a halted story's lessons. May spend AIU.
      description: |
        For a review that failed, was cancelled or should look again with the requester's notes, or for the lessons of a
        halted story (no review is queued when a story halts). Queues one worker run of the server's knowledge agent for
        the story, pinned to the control repo's HEAD now. The agent reads the evidence Ahoy seeds (untrusted text) and the
        content repository, and may change only `knowledge/business-context.md` and `knowledge/lessons.md` in its own
        copy, only the lessons when the story is halted when the run starts; it has no MCP server and no shell. It
        changes nothing about the story.

        The story must be `done` or `halted` (`409 invalid_state` otherwise). `confirmSpend` must be true. The run is capped at
        `budgetNanoAiu` (at most 100 AIU), else the server's knowledge cap (10 AIU by default); it is not charged to the
        story. It shares the run slots with the stories' runs, so it may wait (`queued`). Poll `listKnowledgeReviews` for
        the outcome. One knowledge review per story is in progress at a time: another request answers
        `409 invalid_state`. `503 unavailable` when the server runs no knowledge reviews or the control repo cannot be
        read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeReviewRequest' }
      responses:
        '202':
          description: The knowledge review, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeReview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /stories/{key}/knowledge-reviews/cancel:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: cancelKnowledgeReview
      tags: [stories]
      summary: Stop the story's knowledge review in progress.
      description: |
        A queued one ends `cancelled` at once and spends nothing. A running one is marked `cancelRequested`; the
        reconciler stops its worker and records what it spent. Who cancelled and why become its `exitReason`.
        `409 invalid_state` when nothing is in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRefinementRequest' }
      responses:
        '202':
          description: The knowledge review, cancelled or being cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeReview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /stories/{key}/events:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: listStoryEvents
      tags: [events]
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events after `after`, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /events/stream:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Live events as Server-Sent Events.
      description: |
        Each message is `id: <Event.id>`, `event: <Event.type>` and one `data:` line holding the
        `Event` JSON. IDs are stable and increase monotonically. To resume, reconnect with the
        `Last-Event-ID` header (or `after`); the server replays every later event before streaming
        new ones. Comment lines (`: keepalive`) are sent periodically. Clients that cannot use SSE
        may poll `listStoryEvents` instead.
      parameters:
        - name: story
          in: query
          required: false
          description: Only events for this story.
          schema: { $ref: '#/components/schemas/StoryKey' }
        - $ref: '#/components/parameters/After'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { $ref: '#/components/schemas/EventId' }
      responses:
        '200':
          description: An open event stream.
          x-sse-data-schema: { $ref: '#/components/schemas/Event' }
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /refinements:
    get:
      operationId: listRefinements
      tags: [refinements]
      summary: The newest refinement of every Jira issue that has one, newest first, without content.
      description: |
        One entry per Jira issue, so a backlog view can show each item's refinement state in one call. Read the
        Markdown with `getRefinements`. An issue that was never refined is absent.
      responses:
        '200':
          description: The newest refinement of each refined issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefinementSummaryList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /refinements/{key}:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    get:
      operationId: getRefinements
      tags: [refinements]
      summary: Every refinement of one Jira issue, newest first, with the agent's Markdown.
      description: An issue that was never refined answers `200` with no items, not `404`.
      responses:
        '200':
          description: The issue's refinements, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefinementList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestRefinement
      tags: [refinements]
      summary: Ask an agent to pre-refine a Jira backlog item. May spend AIU.
      description: |
        Queues one worker run of the server's refinement agent (`AHOY_REFINEMENT_AGENT`) for the issue, pinned to the
        control repo's HEAD now. The agent reads the issue through the Jira and Confluence MCP servers (and, by
        default, read-only clones of the mapped child repositories) and replies with a pre-refinement in Markdown:
        verdict, summary, proposed story, acceptance criteria, open questions, assumptions, risks, suggested split and
        affected repositories. The reply is kept in Ahoy only; nothing is written to Jira, Confluence or GitHub, and
        the agent writes no files. The issue need not have been started in Ahoy.

        `confirmSpend` must be true. The run is capped at `budgetNanoAiu`, else the server's refinement cap; it is not
        charged to any story. It shares the run slots with the stories' runs, so it may wait (`queued`). Poll
        `getRefinements` for the outcome; refinements send no events. One refinement per issue is in progress at a
        time: another request answers `409 invalid_state`. `503 unavailable` when refinement is not configured or the
        control repo cannot be read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefinementRequest' }
      responses:
        '202':
          description: The refinement, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refinement' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /refinements/{key}/cancel:
    parameters:
      - $ref: '#/components/parameters/StoryKey'
    post:
      operationId: cancelRefinement
      tags: [refinements]
      summary: Stop the issue's refinement in progress.
      description: |
        A queued refinement ends `cancelled` at once and spends nothing. A running one is marked
        `cancelRequested`; the reconciler stops its worker and records what it spent. Who cancelled and why become its
        `exitReason`. `409 invalid_state` when nothing is in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRefinementRequest' }
      responses:
        '202':
          description: The refinement, cancelled or being cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refinement' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: Every meeting with stakeholders, latest start first, with its topic counts.
      description: |
        Meetings keep the topics of business meetings with stakeholders and the notes taken under them (design §5
        "Meetings"). 0 AIU: no agent and no external call. A meeting is not a story; it sends no events.
      parameters:
        - name: status
          in: query
          required: false
          description: Only meetings with this status.
          schema: { $ref: '#/components/schemas/MeetingStatus' }
      responses:
        '200':
          description: The meetings, latest start first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Plan a meeting, alone or as the next one of a series.
      description: |
        With `seriesId`, `title` and `stakeholders` default to the series'. Without it, the meeting is a one-off and
        `title` is required (`400 validation_failed`). `404 not_found` when the series does not exist. Stakeholders are
        kept trimmed, lower-cased and once each.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeetingRequest' }
      responses:
        '201':
          description: The meeting, planned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meeting' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /meetings/{meetingId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: One meeting with its topics in order, each with its notes oldest first.
      responses:
        '200':
          description: The meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meeting' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMeeting
