    KnowledgeReviewList:
      type: object
      required: [key, items]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeReview' }
    KnowledgeReviewRequest:
      type: object
      required: [confirmSpend]
      additionalProperties: false
      properties:
        confirmSpend: { type: boolean, const: true }
        notes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: What the agent should look at, given to it as the requester's notes.
        budgetNanoAiu:
          type: integer
          minimum: 1
          maximum: 100000000000
          description: The run's AIU cap, at most 100 AIU; the server's knowledge cap when absent.
    RefinementSummaryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RefinementSummary' }
    RefinementList:
      type: object
      required: [key, items]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Refinement' }
    StoryState:
      type: object
      required: [key, version, state]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        version: { $ref: '#/components/schemas/Version' }
        state:
          type: object
          description: >-
            The state document (`story_id`, `phase`, `human_gates`, `acceptance_criteria`, `work_packages`,
            `child_repos`, `reviewer_reviews`, `gate_results`, `decision_log`, ...), at `version`. A work package's
            `status` is `pending`, `done`, `in_progress`, `waiting_on_handback`, `failed`, `stalled`, `blocked`,
            `unverified` or `awaiting_ci`. `awaiting_ci`: the implementer reported `unverified` with every gap in
            `deferred_checks` delegated to CI checks the repository declares, and the work was published; its
            dependents may start, and child_ready waits for each check. Such a package also has `deferred_checks`
            (`check` type, resolved check `name`, `criteria`, `reason`), `delivered_sha` and `delivered_at`; once
            child_ready sees every check SUCCESS on a pull-request head that contains `delivered_sha`, it is `done`
            and the decision log keeps each check and commit (`ci_verified`); it keeps `deferred_checks` and
            `delivered_sha`, without `delivered_at`, until it is reopened or redelivered. A package reported
            `unverified` without such a delegation, whose work was published, is `done` like a `ready` one: child_ready
            requires its pull request with every check green, the reviewer is told its gaps, and the decision log
            records them (`unverified_delivered`); it stays `unverified`, for a person, only when publication is not
            proven. A work package may also have
            `changed_files` and `mapped_criteria`: what its implementers' handoffs claimed, which narrows the packages a
            review reopens, and `finding_responses` (`id` `R1`.., `status` `fixed` or `disputed`, `detail`): its
            answers to the findings its rework note numbered, kept until a review sends work back again. A review in
            `reviewer_reviews` gives, in `criteria_reasons`, `why` and `proof` (what would prove it) for each verdict
            other than `met`. Its `findings` may carry `previous_id`, `regression` and `new_argument` as the reviewer
            wrote them, and `follow_up` as the harness set it: in a re-review a medium finding that is not a regression
            the rework introduced and not a previous finding still open, or a disputed one upheld without a new
            argument, is a follow-up, recorded for the person at the delivery gate (a `review_follow_up` entry of
            `decision_log`) and not sent to rework.
    GateVerdict:
      type: object
      required: [gate, code, result, message]
      additionalProperties: false
      properties:
        gate: { type: string }
        code: { type: integer, minimum: 0, maximum: 5 }
        result:
          { type: string, enum: [pass, fail, error, branch, halt, reject] }
        message: { type: string }
    Question:
      type: object
      required:
        [
          id,
          round,
          runId,
          text,
          recommendation,
          answer,
          answeredBy,
          answeredAt,
          consumed,
          supersededAt,
        ]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^Q[1-9][0-9]*$' }
        round: { type: integer, minimum: 1 }
        runId: { $ref: '#/components/schemas/RunId' }
        text: { type: string }
        recommendation: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        answeredBy:
          { oneOf: [{ $ref: '#/components/schemas/Actor' }, { type: 'null' }] }
        answeredAt:
          {
            oneOf:
              [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }],
          }
        consumed: { type: boolean }
        supersededAt:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: Non-null means historical context invalidated by an intake refresh; cannot be answered.
    AnswerRequest:
      type: object
      required: [answer, expectedVersion]
      additionalProperties: false
      properties:
        answer: { type: string, minLength: 1, maxLength: 20000 }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    AnswerAccepted:
      type: object
      required: [story, question]
      additionalProperties: false
      properties:
        story: { $ref: '#/components/schemas/Story' }
        question: { $ref: '#/components/schemas/Question' }
    GateRecord:
      type: object
      required:
        [id, source, gate, phase, outcome, message, actor, runId, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        source:
          type: string
          enum: [gate, human]
          description: '`gate`: an automated gate the harness ran. `human`: a recorded decision.'
        gate:
          {
            type: string,
            description: 'Gate name (`intake`, `plan`) or human gate key (`plan_accepted`).',
          }
        phase: { $ref: '#/components/schemas/Phase' }
        outcome:
          type: string
          enum: [pass, fail, error, branch, halt, reject, approve, send_back]
        message:
          type: [string, 'null']
          description: >-
            A child_ready `fail` while work packages are `awaiting_ci` is a wait, not a stuck package: one line per
            deferred check says what it waits on, e.g. "WP1 awaits 'facility-pages / playwright' at commit 8b30531
            (not reported yet); WP2 depends on WP1". Repeated polls with the same verdict are recorded once.
        actor: { $ref: '#/components/schemas/Actor' }
        runId:
          { oneOf: [{ $ref: '#/components/schemas/RunId' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    DecisionRequest:
      type: object
      required: [gate, decision, expectedVersion]
      additionalProperties: false
      properties:
        gate:
          type: string
          description: Human gate key from the phase table, e.g. `plan_accepted`.
          pattern: '^[a-z][a-z0-9_]*$'
        decision:
          type: string
          enum: [approve, send_back, reject]
          description: |
            `approve` advances per the phase table. `send_back` returns the story to the phase
            that produced the artifact with `reason` for the agent (counts a revision round).
            `reject` moves the story to `blocked`. `send_back` and `reject` require `reason`.
        reason: { type: string, maxLength: 5000 }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    DecisionAccepted:
      type: object
      required: [story, record]
      additionalProperties: false
      properties:
        story: { $ref: '#/components/schemas/Story' }
        record: { $ref: '#/components/schemas/GateRecord' }
    Artifact:
      type: object
      required: [path, sha256, sizeBytes, mediaType, revision, runId, createdAt]
      additionalProperties: false
      properties:
        path: { $ref: '#/components/schemas/ArtifactPath' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, minimum: 0 }
        mediaType: { type: string }
        revision:
          type: integer
          minimum: 1
          description: The artifact-set revision this entry belongs to (every revision is a complete set).
        runId:
          { oneOf: [{ $ref: '#/components/schemas/RunId' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    EventType:
      type: string
      description: Stable event type. New types may be added in a minor version; clients must ignore unknown types.
      examples:
        - story.started
        - story.halted
        - story.resumed
        - story.intake_refreshed
        - design.refreshed
        - story.budget_changed
        - story.models_changed
        - story.phase_changed
        - story.awaiting_input
        - story.awaiting_decision
        - run.queued
        - run.dispatched
        - run.finished
        - gate.evaluated
        - question.asked
        - question.answered
        - decision.recorded
        - review.resolved
        - work_package.decided
        - work.reopened
        - story.unblocked
        - criteria.anchors_amended
        - artifacts.updated
        - implementation.reported
        - review.reported
        - story.routed
        - run.progress
        - run.waiting
        - knowledge_review.queued
        - knowledge_review.skipped
    Event:
      type: object
      required: [id, storyKey, type, actor, payload, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/EventId' }
        storyKey: { $ref: '#/components/schemas/StoryKey' }
        type: { $ref: '#/components/schemas/EventType' }
        actor: { $ref: '#/components/schemas/Actor' }
        payload:
          type: object
          description: >-
            Type-specific JSON; never contains tokens or credentials. A `run.progress` payload is a
            `RunProgressPayload`. A `run.waiting` event says the story's next run is waiting for a run slot: the server
            allows at most `maxActiveRuns` runs queued or running at once (`AHOY_MAX_ACTIVE_RUNS`, one worker container
            or pod each), and `activeRuns` were when the story looked. Its payload is `{phase, activeRuns,
            maxActiveRuns}`. It is written once when the wait starts; the story stays `ready` at the same version and
            its run is queued (`run.queued`) when a slot frees.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    RunProgressPayload:
      description: |
        The payload of a `run.progress` event: what a running agent is doing. The worker writes each step of its
        session to the run's `events.jsonl` as it goes; while the run is running the reconciler reads the new lines
        on each poll (about every 2 seconds, `AHOY_POLL_MS`, at most 4 MiB a poll) and once more when the run ends,
        then to the end of the log (up to 64 MiB), so the run's last steps come before its `run.finished`. Each poll
        that found steps writes them, then one `spend` event:

        - `tool`: a tool call the agent started: the tool's name and a short summary of its main argument (a path,
          a pattern, a query, a URL, a command, a description or an intent), when it has one;
        - `message`: the first 200 characters of a message the agent wrote, on one line;
        - `spend`: the run's spend so far (summed from the log the same way the worker sums it) and counts. It closes
          every batch, so it also says where the reconciler stopped reading (`line`, `offset`); a restarted
          reconciler goes on from there and never writes a step twice. A poll that found only spend or counts writes
          one at most every 30 seconds, and always on the poll that sees the run end.

        Texts are plain (no control characters or terminal escapes, whitespace collapsed) and credential-shaped
        strings are masked as `[REDACTED]`, as in a halt's `workerLog`. Limits: at most 10 steps per poll, the
        latest; at most 200 steps per run, after which only `spend` events are written, so the spend and `omitted`
        keep moving to the end; at most 1000 events per run, a guard that a run reaches only long after its own
        deadline, after which nothing more until `run.finished`. Steps left out are counted in `omitted`, lines that
        could not be read (not JSON, or over 1 MiB) in `skipped`. Progress is shown, never judged: a run's outcome and what is
        charged come only from `run.finished`, and a run that is cancelled, killed or lost may have shown steps that
        no result reflects.
      oneOf:
        - type: object
          required: [runId, kind, line, tool]
          additionalProperties: false
          properties:
            runId: { $ref: '#/components/schemas/RunId' }
            kind: { const: tool }
            line:
              {
                type: integer,
                minimum: 1,
                description: The line of `events.jsonl` (1-based).,
              }
            at:
              {
                $ref: '#/components/schemas/Timestamp',
                description: When the worker logged it,
                if it said.,
              }
            tool: { type: string, minLength: 1, maxLength: 80 }
            summary: { type: string, minLength: 1, maxLength: 120 }
        - type: object
          required: [runId, kind, line, text]
          additionalProperties: false
          properties:
            runId: { $ref: '#/components/schemas/RunId' }
            kind: { const: message }
            line: { type: integer, minimum: 1 }
            at: { $ref: '#/components/schemas/Timestamp' }
            text: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          required:
            [
              runId,
              kind,
              line,
              offset,
              nanoAiu,
              requests,
              steps,
              omitted,
              skipped,
              events,
            ]
          additionalProperties: false
          properties:
            runId: { $ref: '#/components/schemas/RunId' }
            kind: { const: spend }
            line:
              {
                type: integer,
                minimum: 0,
                description: Lines of `events.jsonl` read so far.,
              }
            offset:
              {
                type: integer,
                minimum: 0,
                description: Bytes of `events.jsonl` read so far.,
              }
            nanoAiu:
              type: integer
              minimum: 0
              description: Spent so far by the run, as its log shows it; `run.finished` has what is charged.
            requests:
              { type: integer, minimum: 0, description: Model requests so far. }
            steps:
              {
                type: integer,
                minimum: 0,
                description: '`tool` and `message` events written for the run.',
              }
            omitted:
              {
                type: integer,
                minimum: 0,
                description: Steps left out by the limits.,
              }
            skipped:
              {
                type: integer,
                minimum: 0,
                description: Lines that could not be read.,
              }
            events:
              {
                type: integer,
                minimum: 1,
                description: '`run.progress` events written for the run, this one included.',
              }
    EventPage:
      type: object
      required: [items, lastEventId]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        lastEventId:
          oneOf: [{ $ref: '#/components/schemas/EventId' }, { type: 'null' }]
          description: Pass as `after` to continue.
    MetricsReport:
      type: object
      description: The metrics of one period (`GET /metrics`). AIU in integer nano-AIU, durations in whole seconds.
      required:
        [
          from,
          to,
          totals,
          weeks,
          phases,
          agents,
          runOutcomes,
          topStories,
          halts,
          haltReasons,
          haltWeeks,
          repeatHalts,
          errors,
          gates,
          findings,
          reworkRounds,
          runKinds,
          waits,
          insights,
        ]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totals:
          type: object
          additionalProperties: false
          required:
            [
              nanoAiu,
              runs,
              runsSucceeded,
              inputTokens,
              outputTokens,
              storiesFinished,
              storiesDone,
              storiesBlocked,
              medianNanoAiuPerDoneStory,
              halts,
              haltedStories,
              repeatHaltStories,
              gateEvaluations,
              gatePasses,
              gateErrors,
            ]
          properties:
            nanoAiu: { $ref: '#/components/schemas/MetricsCount' }
            runs: { $ref: '#/components/schemas/MetricsCount' }
            runsSucceeded: { $ref: '#/components/schemas/MetricsCount' }
            inputTokens: { $ref: '#/components/schemas/MetricsCount' }
            outputTokens: { $ref: '#/components/schemas/MetricsCount' }
            storiesFinished: { $ref: '#/components/schemas/MetricsCount' }
            storiesDone: { $ref: '#/components/schemas/MetricsCount' }
            storiesBlocked: { $ref: '#/components/schemas/MetricsCount' }
            medianNanoAiuPerDoneStory: { type: [integer, 'null'], minimum: 0 }
            halts: { $ref: '#/components/schemas/MetricsCount' }
            haltedStories: { $ref: '#/components/schemas/MetricsCount' }
            repeatHaltStories: { $ref: '#/components/schemas/MetricsCount' }
            gateEvaluations: { $ref: '#/components/schemas/MetricsCount' }
            gatePasses: { $ref: '#/components/schemas/MetricsCount' }
            gateErrors: { $ref: '#/components/schemas/MetricsCount' }
        weeks:
          type: array
          description: AIU per phase for each week (Monday 00:00 UTC) that has runs.
          items:
            type: object
            additionalProperties: false
            required: [weekStart, byPhase]
            properties:
              weekStart: { type: string, format: date }
              byPhase:
                type: object
                additionalProperties:
                  { $ref: '#/components/schemas/MetricsCount' }
        phases:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                phase,
                runs,
                nanoAiu,
                medianNanoAiu,
                p90NanoAiu,
                runCapNanoAiu,
                runsAtCap,
                medianDurationSeconds,
                inputTokens,
                outputTokens,
              ]
            properties:
              phase: { $ref: '#/components/schemas/Phase' }
              runs: { $ref: '#/components/schemas/MetricsCount' }
              nanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              medianNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              p90NanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              runCapNanoAiu:
                $ref: '#/components/schemas/MetricsCount'
                description: The median per-run AIU cap of the phase's runs.
              runsAtCap:
                $ref: '#/components/schemas/MetricsCount'
                description: Runs that ended `budget_exceeded`.
              medianDurationSeconds: { type: [integer, 'null'], minimum: 0 }
              inputTokens: { $ref: '#/components/schemas/MetricsCount' }
              outputTokens: { $ref: '#/components/schemas/MetricsCount' }
        agents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [agent, model, runs, nanoAiu, medianNanoAiu, notSucceeded]
            properties:
              agent: { type: string }
              model: { type: [string, 'null'] }
              runs: { $ref: '#/components/schemas/MetricsCount' }
              nanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              medianNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              notSucceeded: { $ref: '#/components/schemas/MetricsCount' }
        runOutcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, runs]
            properties:
              status: { type: string }
              runs: { $ref: '#/components/schemas/MetricsCount' }
        topStories:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              [
                key,
                phase,
                status,
                spentNanoAiu,
                budgetNanoAiu,
                periodNanoAiu,
                runs,
                halts,
                topPhase,
                topPhaseNanoAiu,
              ]
            properties:
              key: { $ref: '#/components/schemas/StoryKey' }
              phase: { $ref: '#/components/schemas/Phase' }
              status: { $ref: '#/components/schemas/StoryStatus' }
              spentNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              budgetNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              periodNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
              runs: { $ref: '#/components/schemas/MetricsCount' }
              halts: { $ref: '#/components/schemas/MetricsCount' }
              topPhase: { $ref: '#/components/schemas/Phase' }
              topPhaseNanoAiu: { $ref: '#/components/schemas/MetricsCount' }
        halts:
          type: array
          items: { $ref: '#/components/schemas/MetricsHalt' }
        haltReasons:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                reason,
                kind,
                actor,
                action,
                halts,
                stories,
                resumed,
                fixedByFirstResume,
                medianHaltedSeconds,
              ]
            properties:
              reason: { type: string }
              kind: { $ref: '#/components/schemas/DiagnosisKind' }
              actor:
                {
                  type: string,
                  enum: [story_owner, operator, agent_maintainer],
                }
              action: { type: string }
              halts: { $ref: '#/components/schemas/MetricsCount' }
              stories: { $ref: '#/components/schemas/MetricsCount' }
              resumed: { $ref: '#/components/schemas/MetricsCount' }
              fixedByFirstResume:
                $ref: '#/components/schemas/MetricsCount'
                description: Resumed halts not followed by another halt with the same diagnosis.
              medianHaltedSeconds: { type: [integer, 'null'], minimum: 0 }
        haltWeeks:
          type: array
          description: >-
            Halts per week (starting Monday, UTC) and diagnosis, oldest week first. `repeated` counts the halts whose
            diagnosis an earlier halt in the period already had, in any story: the lessons from earlier stories should
            make it fall.
          items:
            type: object
            additionalProperties: false
            required: [weekStart, kind, halts, stories, repeated]
            properties:
              weekStart: { type: string, format: date }
              kind: { $ref: '#/components/schemas/DiagnosisKind' }
              halts: { $ref: '#/components/schemas/MetricsCount' }
              stories: { $ref: '#/components/schemas/MetricsCount' }
              repeated: { $ref: '#/components/schemas/MetricsCount' }
        repeatHalts:
          type: array
          description: Stories that halted with the same diagnosis twice or more in a row.
          items:
            type: object
            additionalProperties: false
            required: [storyKey, kind, halts, resumes, nanoAiuBetween, status]
            properties:
              storyKey: { $ref: '#/components/schemas/StoryKey' }
              kind: { $ref: '#/components/schemas/DiagnosisKind' }
              halts: { $ref: '#/components/schemas/MetricsCount' }
              resumes: { $ref: '#/components/schemas/MetricsCount' }
              nanoAiuBetween: { $ref: '#/components/schemas/MetricsCount' }
              status: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/MetricsError' }
        gates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                gate,
                phase,
                runs,
                pass,
                fail,
                rejectOrHalt,
                error,
                notYet,
                topFailure,
              ]
            properties:
              gate: { type: string }
              phase: { $ref: '#/components/schemas/Phase' }
              runs: { $ref: '#/components/schemas/MetricsCount' }
              pass: { $ref: '#/components/schemas/MetricsCount' }
              fail:
                $ref: '#/components/schemas/MetricsCount'
                description: '`fail` and `branch` (sent to rework); a poll that said "not yet" is `notYet`.'
              rejectOrHalt: { $ref: '#/components/schemas/MetricsCount' }
              error:
                $ref: '#/components/schemas/MetricsCount'
                description: The gate could not judge; never a verdict.
              notYet:
                $ref: '#/components/schemas/MetricsCount'
                description: 'Polls of `child_ready` and `pr` that said "not yet" (CI still running): waits, not failures.'
              topFailure:
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [signature, times]
                    properties:
                      signature: { type: string }
                      times: { $ref: '#/components/schemas/MetricsCount' }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, count]
            properties:
              severity: { type: string }
              count: { $ref: '#/components/schemas/MetricsCount' }
        reworkRounds:
          type: array
          description: For the stories that ended in the period, how many went to rework how many times.
          items:
            type: object
            additionalProperties: false
            required: [rounds, stories]
            properties:
              rounds: { $ref: '#/components/schemas/MetricsCount' }
              stories: { $ref: '#/components/schemas/MetricsCount' }
        runKinds:
          type: array
          description: The period's runs by phase and kind (why each ran), with their spend.
          items:
            type: object
            additionalProperties: false
            required: [phase, kind, runs, nanoAiu]
            properties:
              phase: { $ref: '#/components/schemas/Phase' }
              kind:
                type: string
                enum:
                  [
                    first,
                    continue,
                    resume,
                    after_answers,
                    re_review,
                    review_rework,
                    ci_fix,
                    revision,
                    retry,
                    design_refresh,
                    repair,
                  ]
              runs: { $ref: '#/components/schemas/MetricsCount' }
              nanoAiu: { $ref: '#/components/schemas/MetricsCount' }
        waits:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                kind,
                gate,
                times,
                outcomes,
                medianSeconds,
                p90Seconds,
                waitingNow,
                longestNowSeconds,
              ]
            properties:
              kind: { type: string, enum: [answers, decision, resume] }
              gate: { type: [string, 'null'] }
              times: { $ref: '#/components/schemas/MetricsCount' }
              outcomes:
                type: object
                additionalProperties:
                  { $ref: '#/components/schemas/MetricsCount' }
              medianSeconds: { type: [integer, 'null'], minimum: 0 }
              p90Seconds: { type: [integer, 'null'], minimum: 0 }
              waitingNow: { $ref: '#/components/schemas/MetricsCount' }
              longestNowSeconds: { type: [integer, 'null'], minimum: 0 }
        insights:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rule, title, evidence, action]
            properties:
              rule:
                {
                  type: string,
                  enum:
                    [
                      phase_run_cap,
                      resume_loop,
                      gate_first_fail,
                      gate_tooling_errors,
                    ],
                }
              title: { type: string }
              evidence: { type: string }
              action: { type: string }
    MetricsCount:
      type: integer
      minimum: 0
    MetricsHalt:
      type: object
      additionalProperties: false
      required:
        [
          storyKey,
          at,
          reason,
          phase,
          runId,
          kind,
          actor,
          action,
          resumedAt,
          endedBy,
        ]
      properties:
        storyKey: { $ref: '#/components/schemas/StoryKey' }
        at: { type: string, format: date-time }
        reason: { type: string }
        phase: { type: [string, 'null'] }
        runId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/DiagnosisKind' }
        actor: { type: string, enum: [story_owner, operator, agent_maintainer] }
        action: { type: string }
        resumedAt:
          type: [string, 'null']
          format: date-time
          description: When the story moved on (a Resume, a person's other exit, an unblock); `null` while it has not.
        endedBy:
          type: [string, 'null']
          description: The event that moved it on (`story.resumed`, `work_package.decided`, `story.unblocked`, ...).
    MetricsError:
      type: object
      additionalProperties: false
      required:
        [
          source,
          code,
          signature,
          phase,
          agent,
          times,
          stories,
          firstSeen,
          lastSeen,
          exampleStory,
          exampleRunId,
        ]
      properties:
        source: { type: string, enum: [halt, gate_fail, gate_error, run] }
        code:
          type: string
          description: "The halt reason, the gate's name or the run's status."
        signature:
          type: string
          description: The message with ids, numbers and hashes blanked, so that the same error groups (untrusted text).
        phase: { type: [string, 'null'] }
        agent: { type: [string, 'null'] }
        times: { $ref: '#/components/schemas/MetricsCount' }
        stories: { $ref: '#/components/schemas/MetricsCount' }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        exampleStory: { $ref: '#/components/schemas/StoryKey' }
        exampleRunId: { type: [string, 'null'] }
    MeetingStatus:
      type: string
      enum: [planned, in_progress, ended]
      description: '`planned`, then `in_progress` once started, then `ended` (read-only).'
    RaisedBy:
      type: string
      enum: [us, them]
      description: Who brought the topic up, our side or a stakeholder.
    TopicOrigin:
      type: string
      enum: [planned, in_meeting]
      description: Noted before the meeting started, or raised during it.
    TopicStatus:
      type: string
      enum: [open, moved]
      description: '`moved`: carried over to the next meeting, read-only here.'
    Email:
      type: string
      format: email
      maxLength: 320
    MeetingSeries:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          stakeholders,
          cadenceDays,
          jiraProjectKey,
          jiraIssueType,
          createdBy,
          createdByName,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        stakeholders: { type: array, items: { type: string } }
        cadenceDays: { type: [integer, 'null'], minimum: 1, maximum: 366 }
        jiraProjectKey:
          oneOf:
            - { $ref: '#/components/schemas/JiraProjectKey' }
            - { type: 'null' }
          description: Where stories drafted from the series' meetings are created; null when creating is off.
        jiraIssueType: { $ref: '#/components/schemas/JiraIssueType' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdByName: { $ref: '#/components/schemas/ActorName' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    MeetingSeriesList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingSeries' }
    CreateMeetingSeriesRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, pattern: "\\S" }
        stakeholders:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Email' }
        cadenceDays:
          type: integer
          minimum: 1
          maximum: 366
          description: Days between meetings (7 for weekly).
        jiraProjectKey: { $ref: '#/components/schemas/JiraProjectKey' }
        jiraIssueType: { $ref: '#/components/schemas/JiraIssueType' }
    UpdateMeetingSeriesRequest:
      type: object
      additionalProperties: false
      required: [jiraProjectKey]
      properties:
        jiraProjectKey:
          oneOf:
            - { $ref: '#/components/schemas/JiraProjectKey' }
            - { type: 'null' }
        jiraIssueType: { $ref: '#/components/schemas/JiraIssueType' }
    JiraProjectKey:
      type: string
      pattern: '^[A-Z][A-Z0-9_]+$'
      maxLength: 50
      description: A Jira project key, such as FIN.
    JiraIssueType:
      type: string
      enum: [Story, Task, Bug]
      description: The issue type a series' stories are created as; `Story` by default.
    MeetingStoryDraftRequest:
      type: object
      additionalProperties: false
      required: [confirmSpend]
      properties:
        confirmSpend: { type: boolean, const: true }
        noteIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: The notes to draft from; all of the topic's notes when absent or empty.
        mode: { $ref: '#/components/schemas/MeetingStoryMode' }
        budgetNanoAiu:
          type: integer
          minimum: 1
          maximum: 50000000000
          description: The run's AIU cap, at most 50 AIU; the server's story draft cap when absent.
    MeetingStoryMode:
      type: string
      enum: [draft, grill]
      description: |
        `draft` (the default): the agent writes the story straight from the notes. `grill`: it asks the person
        questions first, then writes the story from the answers.
    GrillOption:
      type: object
      additionalProperties: false
      required: [label, detail, recommended]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        detail:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: 'What choosing it means for the story.',
          }
        recommended:
          {
            type: boolean,
            description: "The agent's pick; exactly one option of a question has it.",
          }
    GrillQuestion:
      type: object
      additionalProperties: false
      required: [id, text, options]
      properties:
        id:
          {
            type: string,
            pattern: '^Q[1-9][0-9]*$',
            description: 'Q1, Q2, ... in the order asked.',
          }
        text: { type: string, minLength: 1, maxLength: 500 }
        options:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: '#/components/schemas/GrillOption' }
    GrillChoice:
      type: string
      enum: [option, open, own]
      description: "One of the question's options, left open for the story, or the person's own words."
    GrillAnswer:
      type: object
      additionalProperties: false
      required: [questionId, question, choice, answer]
      description: An answer as kept, with the question as it was asked.
      properties:
        questionId: { type: string, pattern: '^Q[1-9][0-9]*$' }
        question: { type: string, minLength: 1 }
        choice: { $ref: '#/components/schemas/GrillChoice' }
        answer:
          type: [string, 'null']
          minLength: 1
          description: The option chosen (its label and detail) or the person's words; null when left open.
    MeetingStoryAnswersRequest:
      type: object
      additionalProperties: false
      required: [confirmSpend, answers]
      properties:
        confirmSpend: { type: boolean, const: true }
        answers:
          type: array
          maxItems: 6
          description: At most one answer per question; a question not answered is left open.
          items:
            type: object
            additionalProperties: false
            required: [questionId, choice]
            properties:
              questionId: { type: string, pattern: '^Q[1-9][0-9]*$' }
              choice: { $ref: '#/components/schemas/GrillChoice' }
              option:
                type: integer
                minimum: 0
                maximum: 3
                description: "The option's index in the question's `options`; only with `choice: option`."
              text:
                type: string
                minLength: 1
                maxLength: 2000
                description: "The person's own words; only with `choice: own`."
        budgetNanoAiu:
          type: integer
          minimum: 1
          maximum: 50000000000
          description: The second run's AIU cap, at most 50 AIU; the server's story draft cap when absent.
    StoryTemplate:
      type: object
      additionalProperties: false
      required:
        [
          title,
          role,
          want,
          soThat,
          context,
          implementedFeature,
          acceptanceCriteria,
          outOfScope,
          dependencies,
          testNotes,
          openQuestions,
        ]
      description: |
        A user story in Ahoy's fixed template (the workspace story-writer's sections), as the agent wrote it and Ahoy
        checked it. A story drafted before `context`, `implementedFeature`, `dependencies` and `testNotes` existed
        answers them as `null` and empty lists. In Jira the criteria go in the acceptance-criteria checklist, the rest
        in the description.
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        role:
          {
            type: string,
            minLength: 1,
            maxLength: 1000,
            description: 'As a ...',
          }
        want:
          {
            type: string,
            minLength: 1,
            maxLength: 1000,
            description: 'I want ...',
          }
        soThat:
          {
            type: string,
            minLength: 1,
            maxLength: 1000,
            description: 'So that ...',
          }
        context:
          type: [string, 'null']
          minLength: 1
          maxLength: 2000
          description: Why now and what exists today.
        implementedFeature:
          type: [string, 'null']
          minLength: 1
          maxLength: 2000
          description: What the system does once the story ships.
        acceptanceCriteria:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        outOfScope:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        dependencies:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        testNotes:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        openQuestions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
    MeetingStoryDraftStatus:
      type: string
      enum: [drafting, asking, ready, failed, created]
      description: |
        `drafting`: the agent is writing it (or, for a grill, its questions). `asking`: a grill's questions wait for
        the person's answers. `ready`: the story can be checked and created. `failed`: no story, see `failure`.
        `created`: in Jira as `jiraKey`.
    MeetingStoryDraft:
      type: object
      additionalProperties: false
      required:
        [
          id,
          topicId,
          meetingId,
          topicTitle,
          noteIds,
          mode,
          status,
          story,
          failure,
          questions,
          answers,
          spentNanoAiu,
          target,
          jiraKey,
          jiraUrl,
          jiraCreatedBy,
          jiraCreatedAt,
          run,
          createdBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        topicTitle: { type: string }
        noteIds:
          type: array
          items: { type: string, format: uuid }
          description: The chosen notes; empty means all of the topic's notes.
        mode: { $ref: '#/components/schemas/MeetingStoryMode' }
        status: { $ref: '#/components/schemas/MeetingStoryDraftStatus' }
        story:
          oneOf:
            - { $ref: '#/components/schemas/StoryTemplate' }
            - { type: 'null' }
        failure:
          {
            type: [string, 'null'],
            description: 'Why there is no story, for a failed draft.',
          }
        questions:
          description: A grill's questions, once the agent asked them; null for a plain draft and before.
          oneOf:
            - type: array
              minItems: 1
              maxItems: 6
              items: { $ref: '#/components/schemas/GrillQuestion' }
            - { type: 'null' }
        answers:
          description: A grill's answers, one per question in their order, once sent; null before and for a plain draft.
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/GrillAnswer' }
            - { type: 'null' }
        spentNanoAiu:
          type: integer
          minimum: 0
          description: What every run of the draft spent, a grill's two runs together.
        target:
          type: object
          additionalProperties: false
          required: [projectKey, issueType]
          description: Where Create in Jira puts it, from the series; a null project means it cannot be created.
          properties:
            projectKey: { type: [string, 'null'] }
            issueType: { type: [string, 'null'] }
        jiraKey: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]+-[0-9]+$' }
        jiraUrl:
          {
            type: [string, 'null'],
            format: uri,
            description: 'The issue in Jira, once created.',
          }
        jiraCreatedBy:
          oneOf:
            - { $ref: '#/components/schemas/Actor' }
            - { type: 'null' }
        jiraCreatedAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        run:
          description: The draft's latest agent run, the one its status follows.
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, budgetNanoAiu, nanoAiu, cancelRequested]
              properties:
                status: { type: string }
                budgetNanoAiu: { type: integer, minimum: 1 }
                nanoAiu: { type: integer, minimum: 0 }
                cancelRequested: { type: boolean }
            - { type: 'null' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    MeetingStoryDraftList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingStoryDraft' }
    MeetingSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          seriesId,
          seriesName,
          title,
          startsAt,
          endsAt,
          stakeholders,
          status,
          startedAt,
          endedAt,
          topicCount,
          openTopicCount,
          createdBy,
          createdByName,
          createdAt,
          updatedBy,
          updatedByName,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, 'null'], format: uuid }
        seriesName: { type: [string, 'null'] }
        title: { type: string }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { type: [string, 'null'], format: date-time }
        stakeholders: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        topicCount:
          type: integer
          minimum: 0
          description: Every topic of the meeting, moved ones included.
        openTopicCount: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdByName: { $ref: '#/components/schemas/ActorName' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/Actor' }
        updatedByName: { $ref: '#/components/schemas/ActorName' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    MeetingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingSummary' }
    MeetingNoteKind:
      type: string
      enum: [note, decision, action, question]
      description: |
        `note`: what was said. `decision`: what was agreed. `action`: something a person does next, with an optional
        owner and due day. `question`: what is still to be answered.
    MeetingActionStatus:
      type: string
      enum: [open, done]
    MeetingNote:
      type: object
      additionalProperties: false
      required:
        [
          id,
          topicId,
          text,
          kind,
          owner,
          dueOn,
          doneAt,
          doneBy,
          doneByName,
          createdBy,
          createdByName,
          createdAt,
          updatedBy,
          updatedByName,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        text:
          {
            type: string,
            description: 'What was said, as plain text (untrusted).',
          }
        kind: { $ref: '#/components/schemas/MeetingNoteKind' }
        owner:
          type: [string, 'null']
          maxLength: 200
          description: "An action's owner as a person typed it, a name or an e-mail (untrusted); null for other kinds."
        dueOn:
          {
            type: [string, 'null'],
            format: date,
            description: "An action's due day; null when none.",
          }
        doneAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'When the action was marked done.',
          }
        doneBy:
          {
            type: [string, 'null'],
            minLength: 1,
            maxLength: 200,
            description: 'Who marked the action done.',
          }
        doneByName: { $ref: '#/components/schemas/ActorName' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdByName: { $ref: '#/components/schemas/ActorName' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/Actor' }
        updatedByName: { $ref: '#/components/schemas/ActorName' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    MeetingTopicLink:
      type: object
      additionalProperties: false
      required: [topicId, meetingId, meetingStartsAt]
      properties:
        topicId: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        meetingStartsAt: { $ref: '#/components/schemas/Timestamp' }
    MeetingTopic:
      type: object
      additionalProperties: false
      required:
        [
          id,
          meetingId,
          title,
          raisedBy,
          raisedByEmail,
          origin,
          status,
          position,
          carriedFrom,
          movedTo,
          notes,
          createdBy,
          createdByName,
          createdAt,
          updatedBy,
          updatedByName,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        meetingId: { type: string, format: uuid }
        title: { type: string }
        raisedBy: { $ref: '#/components/schemas/RaisedBy' }
        raisedByEmail:
          {
            type: [string, 'null'],
            description: 'The stakeholder who raised it, when known.',
          }
        origin: { $ref: '#/components/schemas/TopicOrigin' }
        status: { $ref: '#/components/schemas/TopicStatus' }
        position: { type: integer, minimum: 0 }
        carriedFrom:
          description: The topic this one was carried over from, in the previous meeting.
          oneOf:
            - { $ref: '#/components/schemas/MeetingTopicLink' }
            - { type: 'null' }
        movedTo:
          description: Where a moved topic went.
          oneOf:
            - { $ref: '#/components/schemas/MeetingTopicLink' }
            - { type: 'null' }
        notes:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/MeetingNote' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdByName: { $ref: '#/components/schemas/ActorName' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/Actor' }
        updatedByName: { $ref: '#/components/schemas/ActorName' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Meeting:
      type: object
      additionalProperties: false
      required:
        [
          id,
          seriesId,
          seriesName,
          title,
          startsAt,
          endsAt,
          stakeholders,
          status,
          startedAt,
          endedAt,
          topicCount,
          openTopicCount,
          createdBy,
          createdByName,
          createdAt,
          updatedBy,
          updatedByName,
          updatedAt,
          topics,
        ]
      properties:
        id: { type: string, format: uuid }
        seriesId: { type: [string, 'null'], format: uuid }
        seriesName: { type: [string, 'null'] }
        title: { type: string }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { type: [string, 'null'], format: date-time }
        stakeholders: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        topicCount:
          type: integer
          minimum: 0
          description: Every topic of the meeting, moved ones included.
        openTopicCount: { type: integer, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdByName: { $ref: '#/components/schemas/ActorName' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/Actor' }
        updatedByName: { $ref: '#/components/schemas/ActorName' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        topics:
          type: array
          description: In their order.
          items: { $ref: '#/components/schemas/MeetingTopic' }
    CreateMeetingRequest:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties:
        seriesId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200, pattern: "\\S" }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { $ref: '#/components/schemas/Timestamp' }
        stakeholders:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Email' }
    UpdateMeetingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200, pattern: "\\S" }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'null removes the end time.',
          }
        stakeholders:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Email' }
    EndMeetingRequest:
      type: object
      additionalProperties: false
      required: [carryOver]
      properties:
        carryOver:
          type: array
          maxItems: 200
          description: The open topics to carry over to the next meeting; empty to carry none.
          items: { type: string, format: uuid }
    EndMeetingResult:
      type: object
      additionalProperties: false
      required: [meeting, nextMeeting]
      properties:
        meeting: { $ref: '#/components/schemas/Meeting' }
        nextMeeting:
          oneOf:
            - { $ref: '#/components/schemas/Meeting' }
            - { type: 'null' }
    AddMeetingTopicRequest:
      type: object
      additionalProperties: false
      required: [title, raisedBy]
      properties:
        title: { type: string, minLength: 1, maxLength: 300, pattern: "\\S" }
        raisedBy: { $ref: '#/components/schemas/RaisedBy' }
        raisedByEmail: { $ref: '#/components/schemas/Email' }
    UpdateMeetingTopicRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300, pattern: "\\S" }
        raisedBy: { $ref: '#/components/schemas/RaisedBy' }
        raisedByEmail:
          description: "null removes the stakeholder's e-mail."
          oneOf:
            - { $ref: '#/components/schemas/Email' }
            - { type: 'null' }
    MeetingTopicOrderRequest:
      type: object
      additionalProperties: false
      required: [topicIds]
      properties:
        topicIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    MoveMeetingTopicResult:
      type: object
      additionalProperties: false
      required: [topic, movedTo]
      properties:
        topic: { $ref: '#/components/schemas/MeetingTopic' }
        movedTo: { $ref: '#/components/schemas/MeetingTopic' }
    MeetingNoteRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000, pattern: "\\S" }
        kind: { $ref: '#/components/schemas/MeetingNoteKind' }
        owner:
          {
            type: [string, 'null'],
            maxLength: 200,
            description: 'Only for an action; null or blank clears it.',
          }
        dueOn:
          {
            type: [string, 'null'],
            format: date,
            description: 'Only for an action; null clears it.',
          }
    MeetingNoteDoneRequest:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done: { type: boolean }
    MeetingNoteInContext:
      type: object
      additionalProperties: false
      description: A note with the topic and meeting it was taken in.
      required:
        [note, topicTitle, meetingId, meetingTitle, meetingStartsAt, seriesId]
      properties:
        note: { $ref: '#/components/schemas/MeetingNote' }
        topicTitle:
          { type: string, description: "The topic's title (untrusted)." }
        meetingId: { type: string, format: uuid }
        meetingTitle: { type: string }
        meetingStartsAt: { $ref: '#/components/schemas/Timestamp' }
        seriesId: { type: [string, 'null'], format: uuid }
    MeetingNoteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeetingNoteInContext' }
