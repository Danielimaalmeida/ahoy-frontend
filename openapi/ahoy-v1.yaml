      responses:
        '200':
          description: The topic, changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingTopic' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMeetingTopic
      tags: [meetings]
      summary: Remove a topic and its notes.
      description: '`409 invalid_state` when the topic was moved to the next meeting or its meeting has ended.'
      responses:
        '204':
          description: The topic and its notes are gone.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-topics/{topicId}/move:
    parameters:
      - $ref: '#/components/parameters/MeetingTopicId'
    post:
      operationId: moveMeetingTopic
      tags: [meetings]
      summary: Move one topic, with its notes, to the series' next meeting without ending this one.
      description: |
        The next meeting is found or planned as for `endMeeting`. `409 invalid_state` when the topic was already moved,
        its meeting has ended, or there is no next meeting to take it.
      responses:
        '200':
          description: The moved topic here and its copy in the next meeting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveMeetingTopicResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-topics/{topicId}/notes:
    parameters:
      - $ref: '#/components/parameters/MeetingTopicId'
    post:
      operationId: addMeetingNote
      tags: [meetings]
      summary: Add a note, decision, action or question under a topic.
      description: |
        A plain `note` unless `kind` says otherwise. `owner` and `dueOn` are only for an action (`400
        validation_failed` otherwise). `409 invalid_state` when the topic was moved to the next meeting or its meeting
        has ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingNoteRequest' }
      responses:
        '201':
          description: The note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingNote' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-notes:
    get:
      operationId: listMeetingNotes
      tags: [meetings]
      summary: The notes of one kind across meetings, such as a series' open actions or its decisions.
      description: |
        Latest meeting first, then in the meeting's topic order and the order the notes were taken; at most 500. A note
        under a topic carried over to the next meeting is listed once, as its copy there. `status` is only for
        `kind=action` (`400 validation_failed` otherwise). 0 AIU.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/MeetingNoteKind' }
        - name: seriesId
          in: query
          required: false
          description: Only notes from this series' meetings.
          schema: { type: string, format: uuid }
        - name: meetingId
          in: query
          required: false
          description: Only notes from this meeting.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: Only the actions still to do (`open`) or done.
          schema: { $ref: '#/components/schemas/MeetingActionStatus' }
      responses:
        '200':
          description: The notes, with the topic and meeting each was taken in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingNoteList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /meeting-notes/{noteId}/done:
    parameters:
      - $ref: '#/components/parameters/MeetingNoteId'
    post:
      operationId: setMeetingNoteDone
      tags: [meetings]
      summary: Mark an action done, or not done again.
      description: |
        Records who marked it and when; `done: false` clears both. Allowed after the meeting has ended, since actions
        are done after it. `409 invalid_state` when the note is not an action, or its topic was moved to the next
        meeting (mark the copy there).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingNoteDoneRequest' }
      responses:
        '200':
          description: The action, changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingNote' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/MeetingNoteId'
    patch:
      operationId: updateMeetingNote
      tags: [meetings]
      summary: Rewrite a note, and change its kind, owner or due day.
      description: |
        `kind`, `owner` and `dueOn` absent keep their values; null clears `owner` or `dueOn`. A note that stops being an
        action loses its owner, due day and done mark. `409 invalid_state` when its topic was moved to the next meeting
        or its meeting has ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingNoteRequest' }
      responses:
        '200':
          description: The note, changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingNote' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMeetingNote
      tags: [meetings]
      summary: Remove a note.
      description: '`409 invalid_state` when its topic was moved to the next meeting or its meeting has ended.'
      responses:
        '204':
          description: The note is gone.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-series:
    get:
      operationId: listMeetingSeries
      tags: [meetings]
      summary: Every meeting series, by name.
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSeriesList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMeetingSeries
      tags: [meetings]
      summary: Add a meeting series.
      description: |
        `cadenceDays` lets Ahoy plan the series' next meeting itself when topics are carried over and none is planned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeetingSeriesRequest' }
      responses:
        '201':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSeries' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /meeting-series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/MeetingSeriesId'
    patch:
      operationId: updateMeetingSeries
      tags: [meetings]
      summary: Set where the stories drafted from the series' meetings are created in Jira.
      description: |
        `jiraProjectKey` null turns creating off for the series; drafts can still be written. `jiraIssueType` defaults
        to `Story`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeetingSeriesRequest' }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSeries' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /meetings/{meetingId}/story-drafts:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      operationId: listMeetingStoryDrafts
      tags: [meetings]
      summary: The meeting's story drafts that were not discarded, newest first.
      responses:
        '200':
          description: The drafts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingStoryDraftList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /meeting-topics/{topicId}/story-drafts:
    parameters:
      - $ref: '#/components/parameters/MeetingTopicId'
    post:
      operationId: requestMeetingStoryDraft
      tags: [meetings]
      summary: Ask an agent to draft a user story from a topic. May spend AIU.
      description: |
        Queues one worker run of the server's story draft agent (`AHOY_STORY_DRAFT_AGENT`), labelled `MEET-<n>`. It
        reads the topic, who raised it and the chosen notes (`noteIds`; all of the topic's notes when absent or empty)
        and replies with the story in a fixed template, which Ahoy checks. It has no MCP server, writes no file and never
        writes to Jira. `confirmSpend` must be true; the run is capped at `budgetNanoAiu`, else the server's cap. Poll
        `getMeetingStoryDraft` until it is not `drafting`.

        With `mode: grill` the run asks first: it replies with 1–6 questions, each with 2–4 answer options and one
        recommended, and the draft becomes `asking`. `answerMeetingStoryQuestions` then queues a second run that writes
        the story from the answers.

        `409 invalid_state` when the topic already has an open draft or was moved to the next meeting; `503
        unavailable` when story drafts are not configured or the control repo cannot be read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingStoryDraftRequest' }
      responses:
        '202':
          description: The draft, being written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingStoryDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /meeting-story-drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/MeetingStoryDraftId'
    get:
      operationId: getMeetingStoryDraft
      tags: [meetings]
      summary: One story draft, with its story once the agent has written it.
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingStoryDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: discardMeetingStoryDraft
      tags: [meetings]
      summary: Discard a draft not yet created in Jira, so its topic can be drafted again.
      description: |
        A draft still being written has its run stopped: a queued one spends nothing, a running one is cancelled.
        `409 invalid_state` when the draft was created in Jira; `404` when it was already discarded.
      responses:
        '204':
          description: The draft is discarded.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /meeting-story-drafts/{draftId}/answers:
    parameters:
      - $ref: '#/components/parameters/MeetingStoryDraftId'
    post:
      operationId: answerMeetingStoryQuestions
      tags: [meetings]
      summary: Answer a grill's questions, so the agent writes the story. May spend AIU.
      description: |
        Keeps the answers, one per question at most: an option (its index in `options`), the person's own words, or left
        open; a question not answered is left open and goes under the story's open questions. Then queues a second run
        of the story draft agent under the same `MEET-<n>` label, given the questions and the answers; the draft is
        `drafting` again until it is `ready` or `failed`. Answers are sent once. `confirmSpend` must be true; the run
        is capped at `budgetNanoAiu`, else the server's cap.

        `400` when an answer names no question of the draft, answers one twice or does not fit its choice; `409
        invalid_state` when the draft was written without questions or is not `asking`; `503 unavailable` when story
        drafts are not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingStoryAnswersRequest' }
      responses:
        '202':
          description: The draft, being written from the answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingStoryDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /meeting-story-drafts/{draftId}/create-issue:
    parameters:
      - $ref: '#/components/parameters/MeetingStoryDraftId'
    post:
      operationId: createMeetingStoryIssue
      tags: [meetings]
      summary: Create a ready draft's story in Jira, in its series' project. Writes to Jira.
      description: |
        Creates the issue with the server's Jira credentials (`POST /rest/api/2/issue`): the title as summary; the
        story, its acceptance criteria, what is out of scope, open questions, a grill's answers and the meeting it came
        from as the description; the labels `ahoy-meeting` and `ahoy-draft-<id>`. Once only: a draft already created answers its
        issue. `409 invalid_state` when the draft is not `ready`, or its meeting is a one-off or its series has no Jira
        project; `503 unavailable` when Jira is not configured or refuses (the draft stays `ready`).
      responses:
        '200':
          description: The draft, created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingStoryDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    webeam:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WebEAM (Alpha realm) access token. The `sub` claim is the acting user.
    devActor:
      type: apiKey
      in: header
      name: X-Ahoy-Actor
      description: Local POC only; honoured when the server runs with AHOY_AUTH=dev. The value is the acting user's ID.
  parameters:
    MetricsFrom:
      name: from
      in: query
      description: Start of the period (inclusive). Defaults to 30 days before `to`.
      schema: { type: string, format: date-time }
    MetricsTo:
      name: to
      in: query
      description: End of the period (exclusive). Defaults to now.
      schema: { type: string, format: date-time }
    MetricsOwner:
      name: owner
      in: query
      schema: { type: string, minLength: 1, maxLength: 320 }
    MetricsRepo:
      name: repo
      in: query
      schema: { type: string, minLength: 1, maxLength: 200 }
    MetricsModel:
      name: model
      in: query
      schema: { type: string, minLength: 1, maxLength: 200 }
    StoryKey:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/StoryKey' }
    WorkPackageId:
      name: workPackageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkPackageId' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor`.
      schema: { type: string, maxLength: 200 }
    After:
      name: after
      in: query
      required: false
      description: Return only events with a greater ID.
      schema: { $ref: '#/components/schemas/EventId' }
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingTopicId:
      name: topicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingNoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingSeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingStoryDraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    StoryKey:
      type: string
      pattern: '^[A-Z][A-Z0-9]+-[0-9]+$'
      maxLength: 40
    RunId:
      type: string
      pattern: '^[A-Za-z0-9_.-]+$'
      maxLength: 120
    EventId:
      type: string
      pattern: '^[0-9]+$'
      maxLength: 20
    Actor:
      type: string
      minLength: 1
      maxLength: 200
    ActorName:
      type: [string, 'null']
      maxLength: 200
      description: |
        The name to show for an actor, from the identity provider; null when none is known, and then the actor
        (the qnumber) is shown.
    Timestamp:
      type: string
      format: date-time
    NanoAiu:
      type: integer
      minimum: 0
    Version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; increases on every story change.
    ArtifactPath:
      type: string
      pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$'
      maxLength: 300
    Phase:
      type: string
      description: A phase from the pinned control repo's `phases.tsv`.
      examples: [intake, planning, plan_review, implementation, blocked, done]
    StoryStatus:
      type: string
      enum:
        [ready, running, awaiting_input, awaiting_decision, halted, terminal]
      description: |
        `ready`: the reconciler will act. `running`: a worker run is active.
        `awaiting_input`: questions need answers. `awaiting_decision`: a human gate is open.
        `halted`: stopped for `haltReason` until a person resumes it. `terminal`: done or blocked.
    JiraSprint:
      type: object
      additionalProperties: false
      required: [id, name, state]
      properties:
        id: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1 }
        state: { type: string, enum: [active, future, closed] }
    JiraBacklogIssue:
      type: object
      additionalProperties: false
      required:
        [
          key,
          issueType,
          summary,
          status,
          priority,
          updatedAt,
          sprint,
          readiness,
        ]
      properties:
        key: { type: string, pattern: '^[A-Z][A-Z0-9_]*-[1-9][0-9]*$' }
        issueType: { type: string, enum: [Story, Task, Bug] }
        summary: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        priority: { type: [string, 'null'], minLength: 1 }
        updatedAt: { type: string, format: date-time }
        sprint:
          description: |
            Selected from Jira customfield_10000: active first, then future, then closed; the lowest
            sprint ID breaks ties. Null when unassigned. Supports Jira Server's legacy sprint strings.
          oneOf:
            - $ref: '#/components/schemas/JiraSprint'
            - type: 'null'
        readiness: { $ref: '#/components/schemas/BacklogReadiness' }
    FitReason:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: |
            Stable code a client may translate. Readiness: `no_description`, `no_acceptance_criteria`,
            `short_description`, `blocked`, `spike`, `ci_change`. Plan fit: `ci_change`, `cross_repo_dependency`,
            `many_repositories`, `many_packages`, `long_chain`, `unplanned_criteria`. New codes may be added.
        message:
          {
            type: string,
            minLength: 1,
            description: English explanation with the evidence.,
          }
    BacklogReadiness:
      type: object
      additionalProperties: false
      required: [verdict, reasons]
      properties:
        verdict: { type: string, enum: [ready, attention, missing] }
        reasons:
          type: array
          description: Reasons for `missing` first, then those for `attention`. Empty when `ready`.
          items: { $ref: '#/components/schemas/FitReason' }
    PlanFit:
      type: object
      additionalProperties: false
      required:
        [verdict, reasons, repositories, packages, criteria, longestChain]
      properties:
        verdict: { type: string, enum: [fits, attention, poor] }
        reasons:
          type: array
          description: Reasons for `poor` first, then those for `attention`. Empty when `fits`.
          items: { $ref: '#/components/schemas/FitReason' }
        repositories: { type: integer, minimum: 1 }
        packages: { type: integer, minimum: 1 }
        criteria: { type: integer, minimum: 0 }
        longestChain:
          {
            type: integer,
            minimum: 1,
            description: Work packages in the longest depends_on chain.,
          }
    StoryPlanFit:
      type: object
      additionalProperties: false
      required: [key, phase, fit]
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        phase: { $ref: '#/components/schemas/Phase' }
        fit:
          oneOf:
            - $ref: '#/components/schemas/PlanFit'
            - type: 'null'
    JiraBacklog:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JiraBacklogIssue' }
        total: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, database]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - bad_request
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - story_exists
            - stale_version
            - invalid_state
            - already_answered
            - decision_already_recorded
            - revision_ceiling_reached
            - unsupported_gate
            - legacy_story
            - internal_error
            - unavailable
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              path: { type: string }
              message: { type: string }
        currentVersion: { $ref: '#/components/schemas/Version' }
    Usage:
      type: object
      required: [requests, nanoAiu, inputTokens, outputTokens]
      additionalProperties: false
      properties:
        requests: { type: integer, minimum: 0 }
        nanoAiu: { $ref: '#/components/schemas/NanoAiu' }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
    Story:
      type: object
      required:
        [
          key,
          title,
          owner,
          phase,
          status,
          haltReason,
          budgetNanoAiu,
          spentNanoAiu,
          controlSha,
          currentRunId,
          version,
          createdAt,
          updatedAt,
        ]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        title: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/Actor' }
        phase: { $ref: '#/components/schemas/Phase' }
        status: { $ref: '#/components/schemas/StoryStatus' }
        haltReason: { type: [string, 'null'] }
        budgetNanoAiu: { $ref: '#/components/schemas/NanoAiu' }
        spentNanoAiu: { $ref: '#/components/schemas/NanoAiu' }
        controlSha:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Control-repo commit (agents, skills, phase rules) pinned for the story's life.
        currentRunId:
          { oneOf: [{ $ref: '#/components/schemas/RunId' }, { type: 'null' }] }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    StoryPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Story' }
        nextCursor: { type: [string, 'null'] }
    StartStoryRequest:
      type: object
      required: [key, budgetNanoAiu]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        title: { type: string, maxLength: 500 }
        budgetNanoAiu:
          type: integer
          minimum: 1
          description: Hard AIU cap for every run of the story together.
        controlRef:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Control-repo commit to pin. Defaults to the configured control repo's HEAD.
        models:
          $ref: '#/components/schemas/ModelPlanRequest'
          description: >-
            The model and reasoning effort for each phase; a slot left out runs on the server's configured defaults.
            Can be changed later with `setStoryModels`.
    StopStoryRequest:
      type: object
      required: [expectedVersion, reason]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WorkPackageId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      maxLength: 64
      description: A work package id from the plan, e.g. `WP1`.
    RepoAlias:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      maxLength: 64
      description: A plan alias of a child repository, as in `child_repos[].repo`.
    ResolveReviewRequest:
      type: object
      required: [decision, reason, expectedVersion]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [rework, override]
        reason: { type: string, minLength: 1, maxLength: 5000 }
        packages:
          type: array
          description: '`rework` only: reopen exactly these packages instead of the ones the findings name.'
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/WorkPackageId' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    WorkPackageDecisionRequest:
      type: object
      required: [decision, reason, expectedVersion]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [retry, accept]
        reason: { type: string, minLength: 1, maxLength: 5000 }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    ReopenWorkRequest:
      type: object
      required: [note, expectedVersion]
      additionalProperties: false
      properties:
        note:
          {
            type: string,
            minLength: 1,
            maxLength: 5000,
            description: The rework note the implementer gets.,
          }
        packages:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/WorkPackageId' }
        repos:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RepoAlias' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    RefreshDesignRequest:
      type: object
      required: [expectedVersion, reason, figmaLinks, confirmSpend]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Why the design changed. The UI implementers and the reviewer are given it as a person's decision.
        figmaLinks:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: The new Figma frames, each a figma.com /design/, /file/ or /proto/ link with its node-id.
          items: { type: string, minLength: 1, maxLength: 2000 }
        confirmSpend: { type: boolean, const: true }
    AmendAnchorsRequest:
      type: object
      required: [amendments, reason, expectedVersion]
      additionalProperties: false
      properties:
        amendments:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AnchorAmendment' }
        reason: { type: string, minLength: 1, maxLength: 5000 }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    AnchorAmendment:
      type: object
      required: [criterion, anchor, decision]
      additionalProperties: false
      properties:
        criterion:
          type: string
          minLength: 1
          maxLength: 64
          description: The acceptance criterion's id, e.g. `AC5`.
        anchor:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: The anchor as the plan has it.,
          }
        decision:
          type: string
          enum: [replace, waive]
        replacement:
          type: string
          minLength: 8
          maxLength: 500
          pattern: "\\S"
          description: '`replace` only: text the pull request adds, e.g. the bumped version `joi-18.2.9`.'
    UnblockStoryRequest:
      type: object
      required: [reason, expectedVersion]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 5000 }
        rounds: { type: integer, minimum: 1, maximum: 10, default: 1 }
        repos:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/RepoAlias' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    RefinementRequest:
      type: object
      required: [confirmSpend]
      additionalProperties: false
      properties:
        confirmSpend: { type: boolean, const: true }
        notes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: What the agent should look at, given to it as the requester's notes.
        budgetNanoAiu:
          type: integer
          minimum: 1
          maximum: 100000000000
          description: The run's AIU cap, at most 100 AIU; the server's refinement cap when absent.
    AgentDiagnosisList:
      type: object
      required: [key, items]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/StoryKey' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Refinement' }
    AgentDiagnosisRequest:
      type: object
      required: [confirmSpend]
      additionalProperties: false
      properties:
        confirmSpend: { type: boolean, const: true }
        notes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: What the agent should look into, given to it as the requester's notes.
        budgetNanoAiu:
          type: integer
          minimum: 1
          maximum: 100000000000
          description: The run's AIU cap, at most 100 AIU; the server's diagnosis cap when absent.
    CancelRefinementRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: "\\S" }
    RefreshIntakeRequest:
      type: object
      required: [expectedVersion, reason, confirmSpend]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: "\\S" }
        confirmSpend: { type: boolean, const: true }
    ResumeStoryRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        reason: { type: string, maxLength: 2000 }
    SetStoryBudgetRequest:
      type: object
      required: [expectedVersion, budgetNanoAiu, reason]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        budgetNanoAiu:
          type: integer
          minimum: 1
          description: New hard AIU cap for every run of the story together, including what is already spent.
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ModelSlot:
      type: string
      enum: [intake, planning, implementation, review]
      description: A part of the story that runs on one model, by phase; `review` is the one reviewer of `pr_review`.
    ModelId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
      maxLength: 200
      description: A Copilot model id, e.g. `claude-sonnet-5` or `gpt-5.6-terra`.
      examples: [claude-sonnet-5, gpt-5.6-terra]
    ReasoningEffort:
      type: string
      enum: [low, medium, high, xhigh, max]
      description: The Copilot SDK's reasoning effort levels; a model may accept fewer, or none.
    ModelChoice:
      type: object
      minProperties: 1
      additionalProperties: false
      description: A model, a reasoning effort, or both; what is left out comes from the defaults.
      properties:
        model: { $ref: '#/components/schemas/ModelId' }
        reasoningEffort: { $ref: '#/components/schemas/ReasoningEffort' }
    ModelPlanRequest:
      type: object
      additionalProperties: false
      description: A choice per slot.
      properties:
        intake: { $ref: '#/components/schemas/ModelChoice' }
        planning: { $ref: '#/components/schemas/ModelChoice' }
        implementation: { $ref: '#/components/schemas/ModelChoice' }
        review: { $ref: '#/components/schemas/ModelChoice' }
    ModelPlanChange:
      type: object
      minProperties: 1
      additionalProperties: false
      description: A choice per slot to change; `null` gives a slot back to the configured defaults.
      properties:
        intake:
          {
            oneOf:
              [{ $ref: '#/components/schemas/ModelChoice' }, { type: 'null' }],
          }
        planning:
          {
            oneOf:
              [{ $ref: '#/components/schemas/ModelChoice' }, { type: 'null' }],
          }
        implementation:
          {
            oneOf:
              [{ $ref: '#/components/schemas/ModelChoice' }, { type: 'null' }],
          }
        review:
          {
            oneOf:
              [{ $ref: '#/components/schemas/ModelChoice' }, { type: 'null' }],
          }
    SetStoryModelsRequest:
      type: object
      required: [expectedVersion, models]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        models: { $ref: '#/components/schemas/ModelPlanChange' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    SlotModel:
      type: object
      required:
        [slot, phase, chosen, model, reasoningEffort, modelSource, effortSource]
      additionalProperties: false
      properties:
        slot: { $ref: '#/components/schemas/ModelSlot' }
        phase: { $ref: '#/components/schemas/Phase' }
        chosen:
          description: What a person chose for the story; null when the slot runs on the defaults.
          oneOf:
            - $ref: '#/components/schemas/ModelChoice'
            - type: 'null'
        model:
          description: The model the slot's next run gets; null leaves it to the agent profile.
          oneOf:
            - $ref: '#/components/schemas/ModelId'
            - type: 'null'
        reasoningEffort:
          description: The effort the slot's next run gets; null is the model's own default.
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        modelSource:
          type: string
          enum: [revision, story, configuration, phase_table, agent_profile]
          description: >-
            `revision`: a one-round override for the phase the story is in; `story`: the person's choice;
            `configuration`: the server's phase configuration; `phase_table`: the pinned `phases.tsv`;
            `agent_profile`: no model is named, so the agent's own profile decides.
        effortSource:
          type: string
          enum: [revision, story, configuration, phase_table, model_default]
    ModelPlan:
      type: object
      required: [storyKey, version, slots]
      additionalProperties: false
      properties:
        storyKey: { $ref: '#/components/schemas/StoryKey' }
        version: { $ref: '#/components/schemas/Version' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/SlotModel' }
    CatalogModel:
      type: object
      required: [id, label, reasoningEfforts]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/ModelId' }
        label:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: What a person reads; the id when none is configured.,
          }
        reasoningEfforts:
          description: The efforts the model takes (`[]`, none); null when the catalogue does not say.
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/ReasoningEffort' }
            - type: 'null'
    SlotDefault:
      type: object
      required: [slot, phase, model, reasoningEffort, modelSource, effortSource]
      additionalProperties: false
      description: What a slot of a story started now runs on when nobody chooses (a `SlotModel` without `chosen`).
      properties:
        slot: { $ref: '#/components/schemas/ModelSlot' }
        phase: { $ref: '#/components/schemas/Phase' }
        model:
          description: The model; null leaves it to the agent profile.
          oneOf:
            - $ref: '#/components/schemas/ModelId'
            - type: 'null'
        reasoningEffort:
          description: The effort; null is the model's own default.
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        modelSource:
          type: string
          enum: [configuration, phase_table, agent_profile]
        effortSource:
          type: string
          enum: [configuration, phase_table, model_default]
    ModelCatalog:
      type: object
      required: [source, models, reasoningEfforts, controlSha, defaults]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [built_in, file]
          description: Where the list came from; neither is checked against a Copilot account.
        models:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CatalogModel' }
        reasoningEfforts:
          type: array
          description: Every effort `startStory` and `setStoryModels` accept; a model may take fewer.
          items: { $ref: '#/components/schemas/ReasoningEffort' }
        controlSha:
          description: The control commit whose `phases.tsv` filled the defaults; null when it could not be read.
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
        defaults:
          type: array
          items: { $ref: '#/components/schemas/SlotDefault' }
    RunStatus:
      type: string
      enum:
        [
          queued,
          running,
          succeeded,
          awaiting_input,
          failed,
          budget_exceeded,
          timed_out,
          cancelled,
          output_violation,
          auth_failed,
          lost,
        ]
    RuntimeStatus:
      type: [object, 'null']
      description: >-
        Latest worker observation, checked on each active poll and persisted when it changes or at least every ten seconds.
        Separate from the run
        lifecycle: a dispatched run is `running` even while its worker is starting. Null before an observation,
        for runtimes without observations, and after cancellation or completion. `observedAt` is collection time,
        not the worker's start time. Clients should show unavailable status rather than an old wait when stale.
      required: [state, reason, message, observedAt]
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            [starting, scheduling, waiting_for_node, blocked, running, unknown]
          description: >-
            `waiting_for_node` requires a Pending, unscheduled pod whose latest autoscaler decision is
            `TriggeredScaleUp`; Pending alone means `scheduling`, never confirmed node creation.
            `starting` includes a scheduled pod preparing its containers. `blocked` means a container
            startup error or `NotTriggerScaleUp`. `running` means the worker container started and
            startup messages should disappear. `unknown` explicitly means observation failed.
        reason: { type: [string, 'null'], maxLength: 300 }
        message:
          type: [string, 'null']
          maxLength: 300
          description: Bounded, credential-redacted runtime evidence; untrusted plain text, not HTML.
        observedAt: { $ref: '#/components/schemas/Timestamp' }
    Run:
      type: object
      required:
        [
          id,
          storyKey,
          phase,
          agent,
          model,
          reasoningEffort,
          status,
          runtime,
          controlSha,
          budgetNanoAiu,
          usage,
          replayOf,
          exitReason,
          gate,
          startedBy,
          createdAt,
          startedAt,
          endedAt,
        ]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/RunId' }
        storyKey: { $ref: '#/components/schemas/StoryKey' }
        phase: { $ref: '#/components/schemas/Phase' }
        agent: { type: string }
        model:
          type: [string, 'null']
          description: The model the run was started with; null leaves it to the agent profile.
        reasoningEffort:
          description: The reasoning effort the run was started with; null is the model's own default.
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        status: { $ref: '#/components/schemas/RunStatus' }
        runtimeStatus: { $ref: '#/components/schemas/RuntimeStatus' }
        runtime:
          type: string
          description: Where the worker ran, e.g. `docker`, `k8s` (one Kubernetes Job), `replay` (offline re-use of recorded evidence) or `fake`.
        controlSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        budgetNanoAiu: { $ref: '#/components/schemas/NanoAiu' }
        usage: { $ref: '#/components/schemas/Usage' }
        replayOf:
          type: [string, 'null']
          description: >-
            For runtime `replay`, the recorded worker run whose outputs were re-used. Its usage is
            not charged again, so `usage` is zero.
        exitReason: { type: [string, 'null'] }
        gate:
          description: The verdict of the gate that judged this run's output, from the story's gate records.
          oneOf:
            - $ref: '#/components/schemas/GateVerdict'
            - type: 'null'
        startedBy: { $ref: '#/components/schemas/Actor' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        startedAt:
          {
            oneOf:
              [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }],
          }
        endedAt:
          {
            oneOf:
              [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }],
          }
    DiagnosisKind:
      type: string
      enum:
        [
          copilot_auth,
