name: Create Branch Image & Publish to ACR

on:
  workflow_dispatch:
    inputs:
      update-ops-tag:
        type: boolean
        description: 'Update r3da_appx_ops TEST image tag'
        required: false
        default: false

permissions:
  contents: write
  packages: read

jobs:
  publish-branch-container:
    name: 'Build docker image and publish to TEST ACR'
    uses: fio/fio-reusable-workflows/.github/workflows/angular-build-and-publish-reusable.yml@main
    with:
      runner: "['acme-ubuntu-24.04-medium']"
      node-version: ${{ vars.NODE_VERSION }}
      registry-url: ${{ vars.FIO_ACR_URL_TEST }}
      registry-username: ${{ vars.FIO_ACR_USERNAME_TEST }}
      type: 'test'
      environment: 'test'
    secrets:
      registry-password: ${{ secrets.FIO_ACR_SECRET_TEST }}

  validate-image-tag:
    name: 'Validate image tag output'
    needs: publish-branch-container
    if: ${{ inputs['update-ops-tag'] }}
    runs-on: acme-ubuntu-24.04-medium
    steps:
      - name: Ensure image-tag output is available
        env:
          IMAGE_TAG: ${{ needs.publish-branch-container.outputs.image-tag }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "publish-branch-container did not expose image-tag output."
            exit 1
          fi

  update-ops-tag:
    name: 'Update TEST ops tag'
    needs:
      - publish-branch-container
      - validate-image-tag
    if: ${{ inputs['update-ops-tag'] }}
    uses: fio/fio-reusable-workflows/.github/workflows/update-ops-tag-reusable.yml@main
    with:
      image-tag: ${{ needs.publish-branch-container.outputs.image-tag }}
      service: fio-ahoy-frontend
      values-file: charts/fio-ahoy-frontend/values-test.yaml
      tag-path: image.tag
      source-repository: ${{ github.repository }}
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
