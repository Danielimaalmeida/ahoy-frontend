<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Skeleton preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div class="ah-panel" aria-busy="true">
        <div class="ah-panel__body" style="gap: 14px">
          <div
            style="
              display: grid;
              grid-template-columns: 80px minmax(0, 1fr) 90px 60px;
              gap: 14px;
              align-items: center;
            "
          >
            <span class="ah-skeleton" style="height: 20px"></span
            ><span class="ah-skeleton" style="width: 85%"></span
            ><span class="ah-skeleton"></span><span class="ah-skeleton"></span>
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 80px minmax(0, 1fr) 90px 60px;
              gap: 14px;
              align-items: center;
            "
          >
            <span class="ah-skeleton" style="height: 20px"></span
            ><span class="ah-skeleton" style="width: 65%"></span
            ><span class="ah-skeleton"></span><span class="ah-skeleton"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
