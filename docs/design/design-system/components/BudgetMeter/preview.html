<!-- @dsCard group="Status" height=96 subtitle="Budget spent against the AIU cap" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BudgetMeter preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div class="ah-budget">
        <div
          class="ah-meter"
          style="width: 120px"
          role="meter"
          aria-valuemin="0"
          aria-valuemax="30"
          aria-valuenow="12.4"
          aria-label="Budget"
        >
          <i class="ah-meter__fill" style="width: 41%"></i>
        </div>
        <span><b>12.4</b> / 30 AIU</span>
      </div>
      <div class="ah-budget">
        <div class="ah-meter" style="width: 70px">
          <i class="ah-meter__fill" style="width: 7%"></i>
        </div>
        <span class="ah-mono">1.84 / 28.6</span
        ><span class="ah-hint">this run, live</span>
      </div>
    </div>
  </body>
</html>
