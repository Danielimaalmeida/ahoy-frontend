<!-- @dsCard group="Navigation" height=90 subtitle="Status filter for lists" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FilterChips preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div class="ah-chips" role="group" aria-label="Filter by status">
        <button class="ah-chip" type="button" aria-pressed="true">
          All <span class="ah-chip__count">8</span>
        </button>
        <button class="ah-chip" type="button" aria-pressed="false">
          <span
            class="ah-badge ah-badge--running"
            style="height: 18px; padding: 0 7px"
            ><i class="ah-badge__dot"></i>Under way</span
          ><span class="ah-chip__api">running</span
          ><span class="ah-chip__count">1</span>
        </button>
        <button class="ah-chip" type="button" aria-pressed="false">
          <span
            class="ah-badge ah-badge--decision"
            style="height: 18px; padding: 0 7px"
            ><i class="ah-badge__dot"></i>Your orders</span
          ><span class="ah-chip__api">awaiting_decision</span
          ><span class="ah-chip__count">1</span>
        </button>
        <button class="ah-chip" type="button" aria-pressed="false">
          <span
            class="ah-badge ah-badge--halted"
            style="height: 18px; padding: 0 7px"
            ><i class="ah-badge__dot"></i>Anchored</span
          ><span class="ah-chip__api">halted</span
          ><span class="ah-chip__count">2</span>
        </button>
      </div>
    </div>
  </body>
</html>
