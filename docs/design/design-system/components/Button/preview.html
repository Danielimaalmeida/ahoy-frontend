<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Button preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div
        style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"
      >
        <button class="ah-btn ah-btn--primary" type="button">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 3v14M12 4l7 12h-7M11 7l-6 9h6M3 19h18l-2 2H5z"
            ></path></svg
          >Set sail
        </button>
        <button class="ah-btn" type="button">Budget</button>
        <button class="ah-btn ah-btn--soft" type="button">
          Use recommendation
        </button>
        <button class="ah-btn ah-btn--ghost" type="button">Jira ↗</button>
        <button class="ah-btn ah-btn--danger-outline" type="button">
          Stop
        </button>
        <button class="ah-btn ah-btn--danger" type="button">Stop voyage</button>
      </div>
      <div
        style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"
      >
        <button class="ah-btn ah-btn--sm ah-btn--primary" type="button">
          Answer
        </button>
        <button class="ah-btn ah-btn--sm" type="button">
          Review &amp; resume
        </button>
        <button class="ah-btn ah-btn--lg ah-btn--primary" type="button">
          Set sail · up to 25 AIU
        </button>
        <button class="ah-btn" type="button" disabled>Load more</button>
      </div>
    </div>
  </body>
</html>
