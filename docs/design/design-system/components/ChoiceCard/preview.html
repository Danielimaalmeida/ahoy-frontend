<!-- @dsCard group="Forms" height=210 subtitle="Radio choices with consequences" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChoiceCard preview</title></head>
<body>
<div class="ah" style="padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:8px;max-width:420px">
  <label class="ah-choice"><input type="radio" name="d"><span><b>Approve</b><span class="ah-choice__desc">The voyage moves on to implementation.</span></span></label>
  <label class="ah-choice"><input type="radio" name="d" checked><span><b>Send back</b><span class="ah-choice__desc">Cartographer revises the plan. This would be round 3 of 4.</span></span></label>
  <label class="ah-choice"><input type="radio" name="d"><span><b>Reject</b><span class="ah-choice__desc">The voyage runs aground (blocked).</span></span></label>
</div>
</div>
</body>
</html>
