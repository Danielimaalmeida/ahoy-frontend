<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TopBar preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <header class="ah-topbar" style="margin: -16px -16px 0">
        <a class="ah-logo" href="#"
          ><svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="1.8"></circle>
            <path
              d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"
            ></path></svg
          >Ahoy</a
        >
        <nav class="ah-nav" aria-label="Main">
          <a class="ah-nav__item" href="#" aria-current="page"
            >All hands <span class="ah-count">4</span></a
          >
          <a class="ah-nav__item" href="#">Voyages</a>
          <a class="ah-nav__item" href="#"
            >The Docks <span class="ah-soon">planned</span></a
          >
        </nav>
        <input
          class="ah-search"
          type="search"
          placeholder="Search by key or title"
          aria-label="Search voyages"
        />
        <span class="ah-live">Live</span>
        <a class="ah-btn ah-btn--primary" href="#"
          ><svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 3v14M12 4l7 12h-7M11 7l-6 9h6M3 19h18l-2 2H5z"
            ></path></svg
          >Set sail</a
        >
        <span class="ah-avatar" title="alex@example.com">AL</span>
      </header>
    </div>
  </body>
</html>
