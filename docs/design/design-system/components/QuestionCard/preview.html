<!-- @dsCard group="Data" height=300 subtitle="An agent's question and its answer" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>QuestionCard preview</title></head>
<body>
<div class="ah" style="padding:16px;display:flex;flex-direction:column;gap:12px">
<article class="ah-question ah-question--open">
  <div class="ah-question__head"><span class="ah-question__id">Q2</span><span class="ah-badge ah-badge--input"><i class="ah-badge__dot"></i>Needs an answer</span><span class="ah-hint">Round 1</span></div>
  <div class="ah-question__text">Where should the download be offered: on the receipt page only, or also from the order history?</div>
  <div class="ah-question__rec"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg><div style="display:flex;flex-direction:column;gap:6px"><span><b>Cartographer recommends:</b> Receipt page only for now; bulk download is better as its own story.</span><span><button class="ah-btn ah-btn--sm ah-btn--soft" type="button">Use recommendation</button></span></div></div>
  <div class="ah-question__form"><label class="ah-label" for="qa">Your answer</label><textarea id="qa" class="ah-input" style="min-height:60px"></textarea><span style="display:flex;gap:8px;align-items:center"><button class="ah-btn ah-btn--primary" type="button">Send answer</button><span class="ah-hint">Answers are final once sent.</span></span></div>
</article>
</div>
</body>
</html>
