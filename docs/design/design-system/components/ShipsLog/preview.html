<!-- @dsCard group="Data" height=190 subtitle="The activity timeline" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ShipsLog preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div class="ah-panel">
        <div class="ah-log">
          <div class="ah-log__row">
            <span class="ah-log__time">Tue 09:49</span
            ><span class="ah-log__dot ah-log__dot--wait"></span
            ><span><b>Waiting at the human gate</b> plan_accepted, round 2</span
            ><span class="ah-log__who">Ahoy</span>
          </div>
          <div class="ah-log__row">
            <span class="ah-log__time">Tue 09:48</span
            ><span class="ah-log__dot ah-log__dot--pass"></span
            ><span
              ><b>Gate evaluated</b> plan · pass ·
              <a class="ah-key" href="#">r-04</a></span
            ><span class="ah-log__who">Ahoy</span>
          </div>
          <div class="ah-log__row">
            <span class="ah-log__time">Tue 09:30</span
            ><span class="ah-log__dot ah-log__dot--human"></span
            ><span
              ><b>Budget changed</b> 20 → 30 AIU · "Revision needs more
              room"</span
            ><span class="ah-log__who">alex@example.com</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
