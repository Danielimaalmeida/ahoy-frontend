<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Toast preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div class="ah-toast" role="status">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12l4 4 10-10"></path></svg
        ><span>Answer to Q2 sent. 1 question left.</span>
      </div>
    </div>
  </body>
</html>
