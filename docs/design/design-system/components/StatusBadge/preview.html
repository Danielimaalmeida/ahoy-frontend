<!-- @dsCard group="Status" height=120 subtitle="Every story status, with its API word" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StatusBadge preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span class="ah-badge ah-badge--queued"
          ><i class="ah-badge__dot"></i>Queued</span
        >
        <span class="ah-badge ah-badge--running"
          ><i class="ah-badge__dot"></i>Under way</span
        >
        <span class="ah-badge ah-badge--input"
          ><i class="ah-badge__dot"></i>Crew asks</span
        >
        <span class="ah-badge ah-badge--decision"
          ><i class="ah-badge__dot"></i>Your orders</span
        >
        <span class="ah-badge ah-badge--halted"
          ><i class="ah-badge__dot"></i>Anchored</span
        >
        <span class="ah-badge ah-badge--done"
          ><i class="ah-badge__dot"></i>Docked</span
        >
        <span class="ah-badge ah-badge--blocked"
          ><i class="ah-badge__dot"></i>Aground</span
        >
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <span class="ah-badge ah-badge--decision"
          ><i class="ah-badge__dot"></i>Your orders</span
        ><span class="ah-api">awaiting_decision · plan_accepted</span>
      </div>
    </div>
  </body>
</html>
