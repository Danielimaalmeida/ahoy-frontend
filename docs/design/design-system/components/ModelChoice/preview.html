<!-- @dsCard group="Forms" height=210 subtitle="Model and reasoning effort per phase" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ModelChoice preview</title>
  </head>
  <body>
    <div
      class="ah"
      style="padding: 16px; display: flex; flex-direction: column; gap: 12px"
    >
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="ah-model">
          <span class="ah-model__phase"
            >intake<span class="ah-model__crew">Navigator</span></span
          ><select class="ah-input" aria-label="Intake model">
            <option>Default · GPT-5.6 Terra</option>
            <option>Claude Sonnet 5 (claude-sonnet-5)</option>
            <option>GPT-5.6 Terra (gpt-5.6-terra)</option>
            <option>Other model id…</option></select
          ><select class="ah-input" aria-label="Intake effort">
            <option>Default (medium)</option></select
          ><span class="ah-source">Server default</span>
        </div>
        <div class="ah-model">
          <span class="ah-model__phase"
            >planning<span class="ah-model__crew">Cartographer</span></span
          ><select class="ah-input" aria-label="Planning model">
            <option>Claude Sonnet 5 (claude-sonnet-5)</option></select
          ><select class="ah-input" aria-label="Planning effort">
            <option>high</option></select
          ><span style="display: flex; gap: 6px; align-items: center"
            ><span class="ah-source ah-source--chosen"
              >Chosen for this voyage</span
            ><button
              class="ah-btn ah-btn--sm ah-btn--ghost"
              type="button"
              aria-label="Reset planning to default"
              title="Reset to default"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path>
              </svg></button
          ></span>
        </div>
        <div class="ah-model">
          <span class="ah-model__phase"
            >implementation<span class="ah-model__crew">Implementer</span></span
          ><input
            class="ah-input ah-input--mono"
            value="claude-sonnet-5-preview"
            aria-label="Implementation model id"
          /><select class="ah-input" aria-label="Implementation effort">
            <option>Default (model's own)</option></select
          ><span class="ah-source ah-source--chosen">Other model id</span>
        </div>
        <div class="ah-model">
          <span class="ah-model__phase"
            >pr_review<span class="ah-model__crew">Lookout</span></span
          ><select class="ah-input" aria-label="Review model">
            <option>Default · GPT-5.6 Terra</option></select
          ><select class="ah-input" aria-label="Review effort">
            <option>Default (high)</option></select
          ><span class="ah-source">Server default</span>
        </div>
        <span class="ah-hint"
          >The effort list shows only what the chosen model takes. Changes apply
          from each phase's next run.</span
        >
      </div>
    </div>
  </body>
</html>
